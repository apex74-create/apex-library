<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX — Blue Marlin · Fishing Line</title>
<style>
  /* APEX FISHING LINE FACE — the fishing man's demigachi.
     One fish, one classic lure, per face (owner scope, Nov 22, 2026).
     Boot state is the TROPHY WALL: the last landed fish mounted on its
     plaque over the clock — the 90s singing-bass trophy, but it's a
     clock, and the fish is yours. A press casts: bobber in the water,
     wait on the wrist, work the lure with taps, the fish strikes and
     leaps trying to spit the lure while you tap to hold tension.
     Land it and the new fish — new random coloration, new size —
     mounts the wall. Vanilla JS/HTML/CSS long form (Vanilla Doctrine).
     Battery V2 law FROM BIRTH: static at REST, machinery only when
     OBSERVED (ApexFace hook), 12 s auto-exit, nothing holds the
     screen on. Game time is observed time: at REST the water freezes
     time-true, exactly like every other house face. */
  :root{
    --void:#04100d;
    --ink:#eaf6ef;
    --dim:#9db8a8;
    --brass:#c9a227; --brass-hi:#e8c85a;
    --digit:#ffb52e;
    --panel:#000000;
    --danger:#ff5347; --good:#5ee07d; --warn:#ffc44d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void)}
  body{font-family:ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  #face{position:absolute;inset:0}
  #stage{position:absolute;left:0;top:0;
    width:calc(var(--u,1vmin)*100);height:calc(var(--u,1vmin)*100);transition:transform .38s ease}
  svg{width:100%;height:100%;display:block}
  /* STACKED PLATES (v1.1 hybrid, SPEC seat plan): painted plates land
     in seat order around the procedural SVG — seats 0,1,2,3,5,6 below
     it (void, sky, far shapes, body, flow, SCRIM at seat 6), seats
     7,8,9 above it (reed frame set, shimmer set, edge). The stack is
     the lake's depth; the SVG keeps the subject + function plates. */
  .plates{position:absolute;inset:0;pointer-events:none}
  .plates img{position:absolute;inset:0;width:100%;height:100%;display:block}
  #platesBelow{z-index:0}
  #svg{position:relative;z-index:1}
  #platesAbove{z-index:2}
  .pl-reed,.pl-shim{transition:opacity 1.1s linear}
  .pl-reed-b,.pl-shim-b{opacity:0}
  .lbl{position:absolute;width:100%;text-align:center;color:var(--ink);
    letter-spacing:.22em;font-weight:700;pointer-events:none}
  #fishLbl{top:calc(var(--u,1vmin)*2.0);font-size:calc(var(--u,1vmin)*3.6);color:var(--brass-hi)}
  #lureLbl{top:calc(var(--u,1vmin)*6.2);font-size:calc(var(--u,1vmin)*2.0);color:var(--dim);letter-spacing:.16em}
  #readPanel{position:absolute;left:50%;bottom:calc(var(--u,1vmin)*2.6);transform:translateX(-50%);
    background:var(--panel);border:2px solid var(--brass);border-radius:calc(var(--u,1vmin)*1.6);
    padding:calc(var(--u,1vmin)*0.7) calc(var(--u,1vmin)*3.2) calc(var(--u,1vmin)*1.1);text-align:center;min-width:calc(var(--u,1vmin)*52)}
  #clock{font-size:calc(var(--u,1vmin)*11);font-weight:800;color:var(--digit);line-height:1;
    letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #dateLine{font-size:calc(var(--u,1vmin)*2.5);color:var(--ink);letter-spacing:.14em;margin-top:.calc(var(--u,1vmin)*4)}
  /* THE CALLOUT PLATE (owner fix, Nov 24): the shouts get their own
     plate, stacked directly on the clock panel — status row over
     hint row, each row a fixed single line that shrinks to fit, so
     a callout can never wrap over its neighbour, run off the glass,
     or float in dead space. One composed stack at the foot. */
  #calloutPlate{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u,1vmin)*19.9);
    background:var(--panel);border:2px solid var(--brass);border-radius:calc(var(--u,1vmin)*1.6);
    padding:calc(var(--u,1vmin)*0.9) calc(var(--u,1vmin)*3.2) calc(var(--u,1vmin)*1.0);
    min-width:calc(var(--u,1vmin)*62);max-width:calc(var(--u,1vmin)*96);text-align:center;pointer-events:none}
  #statusLine{font-size:calc(var(--u,1vmin)*3.05);font-weight:700;letter-spacing:.14em;color:var(--ink);
    line-height:1.25;white-space:nowrap;overflow:hidden}
  #statusLine:empty{display:none}
  #hintLine{font-size:calc(var(--u,1vmin)*2.25);letter-spacing:.16em;color:var(--dim);
    line-height:1.3;white-space:nowrap;overflow:hidden}
  #hintLine:empty{display:none}
  #stateLamp{position:absolute;right:calc(var(--u,1vmin)*2.4);bottom:calc(var(--u,1vmin)*2.4);font-size:calc(var(--u,1vmin)*1.7);
    letter-spacing:.24em;color:var(--dim);pointer-events:none}
  #dnrChip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u,1vmin)*31);
    display:none;font-size:calc(var(--u,1vmin)*2.0);letter-spacing:.14em;font-weight:700;
    color:#0a1a12;background:var(--brass-hi);border-radius:calc(var(--u,1vmin)*1.2);
    padding:.calc(var(--u,1vmin)*7) calc(var(--u,1vmin)*2.2);text-decoration:none}
  /* FISH ON! — the set moment, flashed big over the scene */
  #fishOn{position:absolute;width:100%;text-align:center;top:calc(var(--u,1vmin)*30);
    font-size:calc(var(--u,1vmin)*11);font-weight:900;letter-spacing:.1em;color:#ffe98a;
    text-shadow:0 0 18px #ffb300,0 2px 0 #7a4d00,0 4px 14px #000;
    opacity:0;pointer-events:none}
  /* the vibration setting — a chip the player owns (battery respect) */
  #vibeChip{position:absolute;right:calc(var(--u,1vmin)*2.2);top:calc(var(--u,1vmin)*9.6);font-size:calc(var(--u,1vmin)*1.9);
    letter-spacing:.16em;font-weight:700;color:var(--ink);
    background:rgba(10,22,16,.72);border:1px solid var(--brass);
    border-radius:calc(var(--u,1vmin)*1.1);padding:.calc(var(--u,1vmin)*6) calc(var(--u,1vmin)*1.6);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
</style>
</head>

<script>
/* ==== APEX BOUND — direct parameter load (fleet bound fix, Nov 23, 2026) ====
   The container senses the display ONCE and loads the bound; this
   script paints inside the loaded parameter with margin (15/16).
   Fallback when no container parameter exists (bench / plain web):
   the window's own inner size, same margin. window.__boundReport
   carries {src, sensed, paint, rect, corr} for the bench. */
(function(){
  "use strict";
  function loadBound(){
    var w = window.innerWidth || 0, h = window.innerHeight || 0, src = "window";
    try {
      if (window.ApexBound && ApexBound.getW() > 0 && ApexBound.getH() > 0) {
        var nw = ApexBound.getW(), nh = ApexBound.getH();
        /* rotation: if the window's orientation disagrees with the
           sensed frame, the sensed frame is the stale one — swap it */
        if ((w > h) !== (nw > nh) && nw !== nh) { var t = nw; nw = nh; nh = t; }
        w = nw; h = nh; src = "container";
      }
    } catch(e){}
    if (!w || !h) return;
    var sensed = Math.min(w, h);
    var paint = Math.floor(sensed * 15 / 16);
    var root = document.documentElement;
    root.style.setProperty("--u", (paint / 100) + "px");
    var fc = document.getElementById("face");
    if (fc) { fc.style.width = w + "px"; fc.style.height = h + "px"; }
    var st = document.getElementById("stage");
    if (st) {
      st.style.left = Math.round((w - paint) / 2) + "px";
      st.style.top = Math.round((h - paint) / 2) + "px";
    }
    window.__boundReport = { src: src, sensedW: w, sensedH: h, sensed: sensed, paint: paint, corr: 1 };
    /* one verification pass: if the painted stage does not measure
       to the loaded bound, correct the unit ONCE and re-centre */
    requestAnimationFrame(function(){
      var s2 = document.getElementById("stage");
      if (!s2 || !window.__boundReport) return;
      var r = s2.getBoundingClientRect();
      window.__boundReport.rect = Math.round(r.width * 10) / 10;
      if (r.width > 0) {
        var corr = paint / r.width;
        window.__boundReport.corr = Math.round(corr * 1000) / 1000;
        if (Math.abs(corr - 1) > 0.02) {
          var p2 = Math.round(paint * corr);
          root.style.setProperty("--u", (p2 / 100) + "px");
          s2.style.left = Math.round((w - p2) / 2) + "px";
          s2.style.top = Math.round((h - p2) / 2) + "px";
          window.__boundReport.paint = p2;
        }
      }
    });
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", loadBound);
  else loadBound();
  var rzT = 0;
  window.addEventListener("resize", function(){
    clearTimeout(rzT); rzT = setTimeout(loadBound, 120);
  });
})();
</script>

<script>
"use strict";
/* ================= CONFIG (stamped per face by build_faces.py) ====== */
var CFG = {"slug": "blue-marlin", "lureShort": "Squid", "lureKind": "squid", "mi": false, "sky": ["#a8d4f0", "#dff2f8"], "water": ["#1d5f9e", "#082a52"], "trees": "#dff2f8", "weed": "#1a4a6a", "fish": {"name": "Blue Marlin", "hue": 226, "sat": 52, "backL": 24, "flankL": 44, "bellyL": 80, "hueJitter": 7, "pattern": "stripes", "depth": 0.27, "tail": "forked", "lenMin": 7, "lenMax": 11.5, "cond": 520, "bill": true, "condDiv": 1000, "unit": "FT", "closeFrame": "bill"}};

/* ================= helpers ========================================== */
var svg = document.getElementById("svg");
var NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  var n = document.createElementNS(NS, tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, attrs){
  var t = el("text", attrs || {}, parent);
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.textContent = s; return t;
}
/* seeded RNG — a catch is rolled from its seed, so the mounted fish is
   the same fish every time the wall paints, until the next catch. */
function RNG(seed){
  var s = (seed >>> 0) || 1;
  return function(){
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }

/* ================= colour: species-true, rolled per catch =========== */
/* Roll a colourway for CFG.fish from a seed: back / flank / belly hsl,
   pattern strength and a size inside the species' real range. */
function rollCatch(seed){
  var r = RNG(seed), F = CFG.fish;
  /* AGE/GROWTH rolls first — it drives the size and the wear on the
     fish. An old fish comes up heavy and scarred; a dinosaur comes up
     monstrous, over the species' book range, slime and all. */
  var au = r(), ageClass = "prime";
  if(au < 0.30) ageClass = "young";
  else if(au >= 0.95) ageClass = "dinosaur";
  else if(au >= 0.75) ageClass = "old";
  var span = F.lenMax - F.lenMin, lenIn;
  if(ageClass === "young") lenIn = F.lenMin + r() * 0.35 * span;
  else if(ageClass === "old") lenIn = F.lenMax - 0.35 * span + r() * 0.35 * span;
  else if(ageClass === "dinosaur") lenIn = F.lenMax + r() * 0.12 * span;
  else lenIn = F.lenMin + r() * span;
  var ageDark = ageClass === "dinosaur" ? 10 : (ageClass === "old" ? 6 : 0);
  var hueJit = (r() - 0.5) * 2 * F.hueJitter;
  var back  = { h: F.hue + hueJit,       s: clamp(F.sat - ageDark * 0.7 + (r()-0.5)*14, 8, 90),  l: clamp(F.backL - ageDark + (r()-0.5)*9, 8, 60) };
  var flank = { h: F.hue + hueJit * 0.7, s: clamp(F.sat - 6 + (r()-0.5)*12, 8, 88), l: clamp(F.flankL - ageDark * 0.5 + (r()-0.5)*9, 18, 78) };
  var belly = { h: F.hue + hueJit * 0.4, s: clamp(F.sat - 22 + (r()-0.5)*8, 4, 70), l: clamp(F.bellyL + (r()-0.5)*6, 55, 94) };
  /* weight from length, species condition factor (rough, labelled in UI
     as the catch card's figures — a game measure, not a scale). */
  var lbs = Math.pow(lenIn, 3) * F.cond / (F.condDiv || 100000);
  return {
    seed: seed, back: back, flank: flank, belly: belly,
    ageClass: ageClass,
    patA: clamp(0.55 + r() * 0.45 + (ageClass === "old" || ageClass === "dinosaur" ? 0.18 : 0), 0, 1),
    patSeed: Math.floor(r() * 1e9),
    lenIn: lenIn, lbs: lbs
  };
}
function hsl(c, a){ return "hsla(" + c.h.toFixed(1) + "," + c.s.toFixed(1) + "%," + c.l.toFixed(1) + "%," + (a == null ? 1 : a) + ")"; }

/* ================= the fish ========================================= */
/* Procedural species fish, drawn facing LEFT (head at -x), centred on
   (0,0), body length L px. Shape knobs come from CFG.fish: depth ratio,
   tail style, snout, bill (marlin), pattern kind. */
function drawFish(parent, C, L, opts){
  opts = opts || {};
  var F = CFG.fish;
  var g = el("g", {}, parent);
  var d = L * F.depth;                       /* body depth */
  var hl = L * 0.24;                         /* head length */
  var r = RNG(C.patSeed);
  /* body outline: nose -> back -> tail peduncle -> belly -> nose */
  var p = [];
  p.push("M " + (-L/2) + " 0");
  p.push("Q " + (-L/2 + hl*0.7) + " " + (-d*0.62) + " " + (-L/2 + hl) + " " + (-d*0.46));
  p.push("Q " + (L*0.05) + " " + (-d*0.56) + " " + (L*0.30) + " " + (-d*0.20));
  p.push("L " + (L*0.40) + " " + (-d*0.10));
  /* tail */
  var tx = L/2, th = d * (F.tail === "round" ? 0.52 : 0.78);
  if(F.tail === "forked"){
    p.push("L " + (tx + L*0.10) + " " + (-th/2));
    p.push("L " + (tx + L*0.035) + " 0");
    p.push("L " + (tx + L*0.10) + " " + (th/2));
  } else if(F.tail === "round"){
    p.push("Q " + (tx + L*0.13) + " 0 " + (tx + L*0.02) + " " + (th/2));
  } else { /* square / paddle */
    p.push("L " + (tx + L*0.09) + " " + (-th/2));
    p.push("L " + (tx + L*0.09) + " " + (th/2));
  }
  p.push("L " + (L*0.40) + " " + (d*0.10));
  p.push("Q " + (L*0.05) + " " + (d*0.56) + " " + (-L/2 + hl) + " " + (d*0.46));
  p.push("Q " + (-L/2 + hl*0.7) + " " + (d*0.62) + " " + (-L/2) + " 0 Z");
  var bodyGrad = "grad" + Math.floor(r() * 1e9);
  var defs = el("defs", {}, g);
  var lg = el("linearGradient", { id: bodyGrad, x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
  el("stop", { offset: "0%",  "stop-color": hsl(C.back) }, lg);
  el("stop", { offset: "52%", "stop-color": hsl(C.flank) }, lg);
  el("stop", { offset: "100%","stop-color": hsl(C.belly) }, lg);
  el("path", { d: p.join(" "), fill: "url(#" + bodyGrad + ")",
    stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-10)}), "stroke-width": 2.3 }, g);
  /* dorsal fin */
  el("path", { d: "M " + (-L*0.06) + " " + (-d*0.47) + " Q " + (L*0.10) + " " + (-d*0.78) + " " + (L*0.24) + " " + (-d*0.30) +
                 " Q " + (L*0.08) + " " + (-d*0.40) + " " + (-L*0.06) + " " + (-d*0.47) + " Z",
    fill: hsl({h:C.back.h, s:C.back.s, l:C.back.l+6}, 0.9) }, g);
  /* pectoral fin */
  el("path", { d: "M " + (-L*0.20) + " " + (d*0.16) + " Q " + (-L*0.06) + " " + (d*0.44) + " " + (L*0.02) + " " + (d*0.30) +
                 " Q " + (-L*0.10) + " " + (d*0.10) + " " + (-L*0.20) + " " + (d*0.16) + " Z",
    fill: hsl({h:C.flank.h, s:C.flank.s, l:C.flank.l-8}, 0.85) }, g);
  /* patterns */
  var pat = F.pattern;
  if(pat === "spots" || pat === "speckle"){
    var n = pat === "spots" ? 26 : 60, dark = pat === "spots";
    for(var i = 0; i < n; i++){
      var sx = -L*0.34 + r() * L*0.66, sy = (r() - 0.5) * d * 0.66;
      var sr = (pat === "spots" ? 2.6 : 1.5) + r() * 2.2;
      el("circle", { cx: sx.toFixed(1), cy: sy.toFixed(1), r: sr.toFixed(1),
        fill: dark ? hsl({h:C.back.h, s:C.back.s, l:Math.max(5, C.back.l-16)}, C.patA)
                   : hsl({h:C.belly.h, s:30, l:88}, C.patA * 0.9) }, g);
    }
  } else if(pat === "lateral"){ /* bass-style dark lateral stripe */
    el("path", { d: "M " + (-L*0.40) + " 0 Q " + (0) + " " + (d*0.10) + " " + (L*0.40) + " " + (d*0.02),
      fill: "none", stroke: hsl({h:C.back.h, s:C.back.s+8, l:Math.max(6, C.back.l-14)}, 0.75 + C.patA*0.25),
      "stroke-width": (d*0.13).toFixed(1), "stroke-linecap": "round" }, g);
  } else if(pat === "mottle"){
    for(var m = 0; m < 7; m++){
      var mx = -L*0.30 + m * L*0.10 + (r()-0.5)*6;
      el("path", { d: "M " + mx + " " + (-d*0.42) + " Q " + (mx + L*0.05) + " 0 " + mx + " " + (d*0.42),
        fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-13)}, C.patA*0.8),
        "stroke-width": (4 + r()*5).toFixed(1), "stroke-linecap": "round" }, g);
    }
  } else if(pat === "bars"){
    for(var b = 0; b < 6; b++){
      var bx = -L*0.26 + b * L*0.115;
      el("path", { d: "M " + bx + " " + (-d*0.33) + " Q " + (bx + 5) + " 0 " + bx + " " + (d*0.33),
        fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, C.patA*0.75),
        "stroke-width": (5 + r()*3).toFixed(1), "stroke-linecap": "round" }, g);
    }
  } else if(pat === "lightspots"){ /* pike: light beans on dark */
    for(var q = 0; q < 34; q++){
      var qx = -L*0.36 + r() * L*0.72, qy = (r() - 0.5) * d * 0.7;
      el("ellipse", { cx: qx.toFixed(1), cy: qy.toFixed(1), rx: (3 + r()*3.4).toFixed(1), ry: (1.7 + r()*1.4).toFixed(1),
        fill: hsl({h:C.belly.h, s:36, l:80}, C.patA) }, g);
    }
  } else if(pat === "stripes"){ /* marlin cobalt bands */
    for(var s2 = 0; s2 < 8; s2++){
      var vx = -L*0.30 + s2 * L*0.085;
      el("path", { d: "M " + vx + " " + (-d*0.38) + " Q " + (vx + 4) + " 0 " + vx + " " + (d*0.28),
        fill: "none", stroke: "hsla(222,80%,72%," + (C.patA*0.8) + ")",
        "stroke-width": 3.4, "stroke-linecap": "round" }, g);
    }
  }
  if(F.earflap){ /* bluegill's dark ear */
    el("path", { d: "M " + (-L*0.335) + " " + (-d*0.16) + " Q " + (-L*0.27) + " 0 " + (-L*0.335) + " " + (d*0.18) +
                   " Q " + (-L*0.375) + " 0 " + (-L*0.335) + " " + (-d*0.16) + " Z",
      fill: "hsla(220,30%,10%,0.92)" }, g);
  }
  if(F.bill){ /* marlin bill */
    el("path", { d: "M " + (-L/2) + " " + (-d*0.05) + " L " + (-L/2 - L*0.30) + " " + (d*0.02) + " L " + (-L/2) + " " + (d*0.10) + " Z",
      fill: hsl({h:C.back.h, s:C.back.s, l:C.back.l+4}) }, g);
    el("path", { d: "M " + (-L*0.02) + " " + (-d*0.50) + " Q " + (L*0.05) + " " + (-d*1.05) + " " + (L*0.16) + " " + (-d*0.34) +
                   " Q " + (L*0.06) + " " + (-d*0.44) + " " + (-L*0.02) + " " + (-d*0.50) + " Z",
      fill: hsl({h:C.back.h, s:C.back.s, l:C.back.l+2}) }, g);
  }
  /* gill line + eye + mouth */
  el("path", { d: "M " + (-L/2 + hl*0.92) + " " + (-d*0.40) + " Q " + (-L/2 + hl*0.66) + " 0 " + (-L/2 + hl*0.92) + " " + (d*0.40),
    fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, 0.65), "stroke-width": 1.6 }, g);
  el("circle", { cx: -L/2 + hl*0.38, cy: -d*0.14, r: Math.max(2.2, L*0.020), fill: "#0b0f0c" }, g);
  el("circle", { cx: -L/2 + hl*0.38 - 0.8, cy: -d*0.14 - 0.8, r: Math.max(0.8, L*0.007), fill: "#e8f2e4" }, g);
  el("path", { d: "M " + (-L/2 + 1) + " " + (d*0.10) + " Q " + (-L/2 + hl*0.4) + " " + (d*0.20) + " " + (-L/2 + hl*0.62) + " " + (d*0.13),
    fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-14)}, 0.8), "stroke-width": 1.5 }, g);
  if(opts.plate){ /* a hint of shine on the mounted fish */
    el("path", { d: "M " + (-L*0.30) + " " + (-d*0.40) + " Q " + (0) + " " + (-d*0.52) + " " + (L*0.28) + " " + (-d*0.26),
      fill: "none", stroke: "hsla(0,0%,100%,0.20)", "stroke-width": 3, "stroke-linecap": "round" }, g);
  }
  if(C.ageClass === "old" || C.ageClass === "dinosaur"){
    /* AGE rendered on the fish: pale scar slashes, and for a dinosaur
       the slime sheen over the back — an old-growth animal. */
    var sr2 = RNG(C.patSeed + 77), nSc = C.ageClass === "dinosaur" ? 4 : 2;
    for(var sc = 0; sc < nSc; sc++){
      var sx2 = -L*0.28 + sr2() * L*0.5, sy2 = (sr2() - 0.5) * d * 0.4;
      el("path", { d: "M " + sx2.toFixed(1) + " " + sy2.toFixed(1) + " l " + (7 + sr2()*8).toFixed(1) + " " + (4 + sr2()*5).toFixed(1),
        fill: "none", stroke: "hsla(60,26%,82%,0.75)", "stroke-width": 1.7, "stroke-linecap": "round" }, g);
    }
    if(C.ageClass === "dinosaur")
      el("path", { d: "M " + (-L*0.36) + " " + (-d*0.30) + " Q " + (0) + " " + (-d*0.60) + " " + (L*0.34) + " " + (-d*0.18) +
                     " Q " + (0) + " " + (-d*0.34) + " " + (-L*0.36) + " " + (-d*0.30) + " Z",
        fill: "hsla(112,42%,64%,0.30)" }, g);
  }
  return g;
}

/* ================= the lure ========================================= */
/* Drawn at (0,0), hanging nose-up on the line; length ~34 px.
   Kinds: longbody (Rapala class), spoon, spinner (Aglia class),
   bucktail, plug (Kwikfish class), beetle (Beetle Spin class),
   craw (crawfish crank), dearie (weight-forward), squid (marlin). */
function drawLure(parent, kind, seed){
  var g = el("g", {}, parent), r = RNG(seed || 7);
  function treble(x, y, s){
    var t = el("g", { transform: "translate(" + x + " " + y + ") scale(" + (s || 1) + ")" }, g);
    el("path", { d: "M0 0 L-3.4 6.4 M0 0 L0 7.4 M0 0 L3.4 6.4", fill: "none",
      stroke: "#cfd8dc", "stroke-width": 1.3, "stroke-linecap": "round" }, t);
    el("circle", { cx: 0, cy: -0.6, r: 1.4, fill: "none", stroke: "#cfd8dc", "stroke-width": 1 }, t);
  }
  if(kind === "longbody"){ /* Rapala long body, three trebles (owner spec) */
    el("path", { d: "M0 -17 Q5 -8 4.4 4 Q4 13 0 17 Q-4 13 -4.4 4 Q-5 -8 0 -17 Z",
      fill: "hsla(28,42%,52%,1)", stroke: "hsla(24,45%,26%,1)", "stroke-width": 1.2 }, g);
    el("path", { d: "M0 -17 Q5 -8 4.4 4 L-4.4 4 Q-5 -8 0 -17 Z", fill: "hsla(210,16%,72%,1)" }, g);
    el("path", { d: "M-4.6 6 Q0 9.6 4.6 6 L3.4 11 Q0 13 -3.4 11 Z", fill: "hsla(0,0%,88%,0.9)" }, g); /* lip */
    el("circle", { cx: -2.4, cy: -11, r: 1.5, fill: "#14100c" }, g);
    el("circle", { cx: 2.4, cy: -11, r: 1.5, fill: "#14100c" }, g);
    treble(0, -3, 1); treble(0, 6, 1); treble(0, 14, 1);   /* THREE trebles */
  } else if(kind === "spoon"){ /* hammered wobbling spoon (Mauler class) */
    el("path", { d: "M0 -16 Q7 -6 6 6 Q5 15 0 18 Q-5 15 -6 6 Q-7 -6 0 -16 Z",
      fill: "hsla(43,74%,58%,1)", stroke: "hsla(40,60%,30%,1)", "stroke-width": 1.2 }, g);
    for(var i = 0; i < 5; i++)
      el("circle", { cx: (r()-0.5)*6, cy: -10 + i*5.4, r: 1.1, fill: "hsla(43,60%,36%,0.55)" }, g);
    el("path", { d: "M-3 -12 Q0 -4 -2 6", fill: "none", stroke: "hsla(0,0%,100%,0.5)", "stroke-width": 1.6 }, g);
    treble(0, 17, 1.05);
  } else if(kind === "spinner"){ /* Aglia class: blade, beads, dressed treble */
    el("ellipse", { cx: 0, cy: -8, rx: 5.4, ry: 9.5, fill: "hsla(46,80%,60%,1)",
      stroke: "hsla(42,64%,32%,1)", "stroke-width": 1.1, transform: "rotate(14)" }, g);
    el("ellipse", { cx: -0.6, cy: -8.6, rx: 2.6, ry: 5.4, fill: "hsla(48,90%,76%,0.9)", transform: "rotate(14)" }, g);
    el("line", { x1: 0, y1: -15, x2: 0, y2: 13, stroke: "#b9c4c9", "stroke-width": 1.4 }, g);
    el("circle", { cx: 0, cy: 0, r: 2.2, fill: "hsla(4,72%,46%,1)" }, g);
    el("circle", { cx: 0, cy: 5, r: 1.9, fill: "hsla(210,60%,46%,1)" }, g);
    el("path", { d: "M-2.6 10 Q-4.4 16 -2 19 Q0 15.4 2 19 Q4.4 16 2.6 10 Q0 12.4 -2.6 10 Z",
      fill: "hsla(26,60%,34%,1)" }, g); /* bucktail dressing */
    treble(0, 12, 0.9);
  } else if(kind === "bucktail"){ /* Musky Killer class: big blade + long tail */
    el("ellipse", { cx: 0, cy: -11, rx: 6.4, ry: 11, fill: "hsla(210,14%,78%,1)",
      stroke: "hsla(210,12%,44%,1)", "stroke-width": 1.1, transform: "rotate(12)" }, g);
    el("line", { x1: 0, y1: -16, x2: 0, y2: 8, stroke: "#b9c4c9", "stroke-width": 1.5 }, g);
    el("path", { d: "M-3.4 4 Q-5 16 -2.4 24 Q0 17 2.4 24 Q5 16 3.4 4 Q0 7 -3.4 4 Z",
      fill: "hsla(45,30%,16%,1)" }, g);
    treble(0, 9, 1.1);
  } else if(kind === "plug"){ /* Kwikfish class: banana plug, rattling curve */
    el("path", { d: "M-1 -16 Q7 -8 6.4 3 Q6 13 1 18 Q-4 12 -4.6 2 Q-5 -9 -1 -16 Z",
      fill: "hsla(96,42%,52%,1)", stroke: "hsla(96,40%,26%,1)", "stroke-width": 1.2 }, g);
    el("path", { d: "M-4.4 -2 Q0 1.4 6.2 -1 L6 4 Q0 6.6 -4.6 3.6 Z", fill: "hsla(350,66%,48%,0.85)" }, g);
    el("circle", { cx: -1.8, cy: -11, r: 1.5, fill: "#14100c" }, g);
    treble(0, 2, 1); treble(0, 13, 1);
  } else if(kind === "beetle"){ /* Beetle Spin class: safety-pin arm + grub */
    el("path", { d: "M0 -16 L7 -6 L0 -1", fill: "none", stroke: "#c7d0d4", "stroke-width": 1.4 }, g);
    el("ellipse", { cx: 8.4, cy: -8, rx: 2.6, ry: 5.2, fill: "hsla(46,80%,60%,1)", transform: "rotate(38 8.4 -8)" }, g);
    el("path", { d: "M0 -1 Q3.4 5 2.4 11 Q1.6 16 -1 19 Q-2.4 12 -1.2 6 Q-0.4 1 0 -1 Z",
      fill: "hsla(60,66%,62%,1)", stroke: "hsla(60,40%,34%,1)", "stroke-width": 1 }, g);
    el("circle", { cx: 0.4, cy: 1.4, r: 2.3, fill: "hsla(210,10%,26%,1)" }, g);
  } else if(kind === "craw"){ /* Rebel Crawfish class */
    el("path", { d: "M0 -14 Q6.4 -8 6 3 Q5.4 12 0 15 Q-5.4 12 -6 3 Q-6.4 -8 0 -14 Z",
      fill: "hsla(18,58%,40%,1)", stroke: "hsla(16,55%,22%,1)", "stroke-width": 1.2 }, g);
    el("path", { d: "M-5.6 -4 Q-11 -8 -12.4 -13 M5.6 -4 Q11 -8 12.4 -13", fill: "none",
      stroke: "hsla(18,58%,34%,1)", "stroke-width": 2.6, "stroke-linecap": "round" }, g);
    el("path", { d: "M-4 8 Q0 10.4 4 8 M-4.6 3.4 Q0 5.8 4.6 3.4", fill: "none",
      stroke: "hsla(16,55%,24%,0.8)", "stroke-width": 1.2 }, g);
    el("circle", { cx: -2.6, cy: -9, r: 1.4, fill: "#14100c" }, g);
    el("circle", { cx: 2.6, cy: -9, r: 1.4, fill: "#14100c" }, g);
    treble(0, 5, 0.95); treble(0, 13, 0.95);
  } else if(kind === "dearie"){ /* Erie Dearie class: weight-forward spinner */
    el("ellipse", { cx: 0, cy: -13, rx: 4.6, ry: 7.6, fill: "hsla(46,80%,60%,1)", transform: "rotate(10)" }, g);
    el("path", { d: "M-3 -5 Q0 -8.4 3 -5 L4.4 6 Q4.4 12 0 13.4 Q-4.4 12 -4.4 6 Z",
      fill: "hsla(210,12%,60%,1)", stroke: "hsla(210,10%,34%,1)", "stroke-width": 1.1 }, g); /* lead head/body */
    el("path", { d: "M0 13.4 Q3 17 1.6 21 M0 13.4 Q-3 17 -1.6 21 M0 13.4 L0 22", fill: "none",
      stroke: "#cfd8dc", "stroke-width": 1.2, "stroke-linecap": "round" }, g); /* hook points */
  } else if(kind === "squid"){ /* marlin squid: mantle, skirt, big eyes */
    el("path", { d: "M0 -18 Q5.4 -10 4.6 -1 L-4.6 -1 Q-5.4 -10 0 -18 Z",
      fill: "hsla(320,44%,62%,1)", stroke: "hsla(320,40%,34%,1)", "stroke-width": 1.1 }, g);
    for(var sq = -3; sq <= 3; sq++)
      el("path", { d: "M" + (sq*1.5) + " 0 Q" + (sq*2.1) + " 10 " + (sq*1.7) + " 19", fill: "none",
        stroke: "hsla(320,44%,52%,0.9)", "stroke-width": 1.7, "stroke-linecap": "round" }, g);
    el("circle", { cx: -2.6, cy: -5.4, r: 1.7, fill: "#12060e" }, g);
    el("circle", { cx: 2.6, cy: -5.4, r: 1.7, fill: "#12060e" }, g);
  } else if(kind === "shadrap"){ /* Shad Rap class: deep shad-body crank */
    el("path", { d: "M0 -16 Q8 -10 8.6 2 Q8.6 12 0 17 Q-8.6 12 -8.6 2 Q-8 -10 0 -16 Z",
      fill: "hsla(210,22%,58%,1)", stroke: "hsla(210,24%,28%,1)", "stroke-width": 1.2 }, g);
    el("path", { d: "M0 -16 Q8 -10 8.6 2 L-8.6 2 Q-8 -10 0 -16 Z", fill: "hsla(200,30%,34%,1)" }, g);
    el("path", { d: "M-8.8 5 Q0 8.6 8.8 5 L7.2 10.6 Q0 12.6 -7.2 10.6 Z", fill: "hsla(0,0%,88%,0.92)" }, g); /* lip */
    el("circle", { cx: -3.4, cy: -8, r: 2.4, fill: "hsla(220,20%,16%,0.85)" }, g); /* shad spot */
    el("circle", { cx: -2.2, cy: -11, r: 1.5, fill: "#14100c" }, g);
    el("circle", { cx: 2.2, cy: -11, r: 1.5, fill: "#14100c" }, g);
    treble(0, 3, 1); treble(0, 13, 1);
  } else if(kind === "tube"){ /* tube jig, craw class: head + tentacle skirt */
    el("path", { d: "M-3.4 -14 Q0 -17 3.4 -14 L3 2 Q0 4 -3 2 Z",
      fill: "hsla(24,44%,34%,1)", stroke: "hsla(22,42%,20%,1)", "stroke-width": 1.1 }, g); /* tube body */
    el("circle", { cx: 0, cy: -15.4, r: 3.1, fill: "hsla(210,10%,30%,1)" }, g);          /* jig head */
    el("circle", { cx: -1.2, cy: -12.4, r: 1.2, fill: "#14100c" }, g);
    for(var tn = -3; tn <= 3; tn++)
      el("path", { d: "M" + (tn * 0.95) + " 3 Q" + (tn * 1.7) + " 10 " + (tn * 1.35) + " 17", fill: "none",
        stroke: "hsla(24,44%,30%,0.95)", "stroke-width": 1.6, "stroke-linecap": "round" }, g); /* tentacles */
    el("path", { d: "M-3 6 Q-6.4 9 -6 13 M3 6 Q6.4 9 6 13", fill: "none",
      stroke: "hsla(18,52%,36%,1)", "stroke-width": 2.2, "stroke-linecap": "round" }, g); /* craw claws */
  } else { /* dardevle-style spoon default */
    el("path", { d: "M0 -16 Q7 -6 6 6 Q5 15 0 18 Q-5 15 -6 6 Q-7 -6 0 -16 Z",
      fill: "hsla(0,66%,46%,1)", stroke: "hsla(0,55%,26%,1)", "stroke-width": 1.2 }, g);
    el("path", { d: "M-6 -2 L6 -4 L6 3 L-6 5 Z", fill: "hsla(0,0%,94%,1)" }, g); /* the red/white */
    treble(0, 17, 1.05);
  }
  return g;
}

/* ================= the front-facing fish (pose frames) ============= */
/* POSE FRAMES (owner, Nov 22): the strike is a pose sequence with
   natural, species-true outlines — the SWALLOW (front-facing, mouth
   open, the bait going in), the MONEY SHOT (front-facing, mouth open,
   eyes wild, the lure visibly hooked in its mouth at the moment the
   set lands), then the side-arc ERUPTION and DIVE the drawFish poses
   already carry. The front head is built per strike from the pending
   catch's own rolled colours, so the face that swallows your lure is
   the fish you are about to fight. */
var FRONT = null;
function drawFishFront(parent, C){
  var F = CFG.fish;
  var g = el("g", {}, parent);
  var head = el("g", {}, g);
  var defs = el("defs", {}, head);
  var fg = el("linearGradient", { id: "frontGrad", x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
  el("stop", { offset: "0%", "stop-color": hsl(C.back) }, fg);
  el("stop", { offset: "55%", "stop-color": hsl(C.flank) }, fg);
  el("stop", { offset: "100%", "stop-color": hsl(C.belly) }, fg);
  /* head outline — a fish coming straight at you */
  el("path", { d: "M-58 -6 Q-62 -50 0 -57 Q62 -50 58 -6 Q55 32 31 47 Q0 59 -31 47 Q-55 32 -58 -6 Z",
    fill: "url(#frontGrad)", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-10)}), "stroke-width": 2.4 }, head);
  el("ellipse", { cx: 0, cy: -34, rx: 34, ry: 15, fill: hsl({h:C.back.h, s:C.back.s, l:C.back.l+8}, 0.5) }, head);
  /* species marks on the forehead */
  var r = RNG(C.patSeed + 5);
  if(F.pattern === "speckle" || F.pattern === "spots"){
    for(var i = 0; i < 16; i++)
      el("circle", { cx: (-40 + r() * 80).toFixed(1), cy: (-48 + r() * 30).toFixed(1), r: (1.3 + r() * 1.6).toFixed(1),
        fill: hsl({h:C.back.h, s:C.back.s, l:Math.max(5, C.back.l-14)}, C.patA * 0.8) }, head);
  } else if(F.pattern === "stripes"){
    for(var s3 = -2; s3 <= 2; s3++)
      el("path", { d: "M" + (s3 * 15) + " -52 Q" + (s3 * 16) + " -30 " + (s3 * 14) + " -12",
        fill: "none", stroke: "hsla(222,80%,72%," + (C.patA * 0.75) + ")", "stroke-width": 3, "stroke-linecap": "round" }, head);
  }
  if(F.earflap){ /* bluegill ears, both sides of the head */
    el("ellipse", { cx: -53, cy: -4, rx: 7, ry: 12, fill: "hsla(220,30%,10%,0.92)" }, head);
    el("ellipse", { cx: 53, cy: -4, rx: 7, ry: 12, fill: "hsla(220,30%,10%,0.92)" }, head);
  }
  if(F.bill){ /* the bill, foreshortened — coming straight at the camera */
    el("path", { d: "M-6 -8 L0 26 L6 -8 Q0 -3 -6 -8 Z", fill: hsl({h:C.back.h, s:C.back.s, l:C.back.l+6}),
      stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-8)}), "stroke-width": 1 }, head);
  }
  /* gill arcs */
  el("path", { d: "M-47 -22 Q-38 4 -44 30", fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, 0.65), "stroke-width": 1.8 }, head);
  el("path", { d: "M47 -22 Q38 4 44 30", fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, 0.65), "stroke-width": 1.8 }, head);
  /* pectoral fins, splayed */
  el("path", { d: "M-52 22 Q-76 30 -72 46 Q-58 44 -50 34 Z", fill: hsl({h:C.flank.h, s:C.flank.s, l:C.flank.l-8}, 0.9) }, head);
  el("path", { d: "M52 22 Q76 30 72 46 Q58 44 50 34 Z", fill: hsl({h:C.flank.h, s:C.flank.s, l:C.flank.l-8}, 0.9) }, head);
  /* eyes — the wild set is one attribute away */
  function eye(side){
    var eg = el("g", { transform: "translate(" + (side * 31) + " -15)" }, head);
    el("circle", { cx: 0, cy: 0, r: 10.5, fill: "#e6eedd", opacity: 0.92 }, eg);
    el("circle", { cx: 0, cy: 0, r: 7.4, fill: "#0b0f0c" }, eg);
    el("circle", { cx: -2.2, cy: -2.4, r: 2.1, fill: "#ffffff" }, eg);
    return eg;
  }
  var eyeL = eye(-1), eyeR = eye(1);
  var browL = el("path", { d: "M-42 -30 Q-31 -37 -20 -30", fill: "none", opacity: 0,
    stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-16)}), "stroke-width": 2.6, "stroke-linecap": "round" }, head);
  var browR = el("path", { d: "M20 -30 Q31 -37 42 -30", fill: "none", opacity: 0,
    stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-16)}), "stroke-width": 2.6, "stroke-linecap": "round" }, head);
  /* nostrils */
  el("circle", { cx: -9, cy: 12, r: 1.7, fill: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, 0.8) }, head);
  el("circle", { cx: 9, cy: 12, r: 1.7, fill: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}, 0.8) }, head);
  /* the mouth: interior + lower jaw; openness is driven per frame */
  var mouthIn = el("ellipse", { cx: 0, cy: 27, rx: 29, ry: 3, fill: "#3d0a08" }, head);
  el("ellipse", { cx: 0, cy: 29, rx: 17, ry: 2, fill: "#200505" }, head);
  var jaw = el("g", {}, head);
  el("path", { d: "M-27 30 Q0 50 27 30 Q0 41 -27 30 Z", fill: hsl({h:C.belly.h, s:C.belly.s, l:Math.max(30, C.belly.l-14)}),
    stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-12)}), "stroke-width": 1.2 }, jaw);
  el("path", { d: "M-29 24 Q0 36 29 24", fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-14)}), "stroke-width": 2 }, head);
  /* the incoming lure (swallow pose) — dives from above into the mouth */
  var inLure = el("g", { opacity: 0 }, g);
  drawLure(inLure, CFG.lureKind, 7);
  /* the lure IN the mouth (chomp + close beats) — centre-mouth, deep */
  var throatLure = el("g", { opacity: 0, transform: "translate(0 33) scale(0.8)" }, head);
  drawLure(throatLure, CFG.lureKind, 7);
  /* TEETH — built only for the toothed class (pike, muskie, walleye):
     an upper row hanging off the mouth roof, a lower row on the jaw.
     The gnash is the jaw's work; the teeth just have to be THERE. */
  var teethG = null;
  if(F.closeFrame === "teeth"){
    teethG = el("g", { opacity: 0 }, head);
    var tx2, tw = 46;
    for(tx2 = -tw; tx2 <= tw; tx2 += 7.5){
      var th2 = 5 + 3.5 * (1 - Math.abs(tx2) / (tw + 6));
      el("path", { d: "M" + tx2.toFixed(1) + " 23 L" + (tx2 + 3).toFixed(1) + " " + (23 + th2).toFixed(1) +
                      " L" + (tx2 + 6).toFixed(1) + " 23 Z", fill: "#e8e4d2", opacity: 0.95 }, teethG);
    }
    var teethLow = el("g", {}, teethG);
    for(tx2 = -tw + 3; tx2 <= tw - 3; tx2 += 8.5){
      var th3 = 4 + 2.6 * (1 - Math.abs(tx2) / (tw + 6));
      el("path", { d: "M" + tx2.toFixed(1) + " 40 L" + (tx2 + 2.6).toFixed(1) + " " + (40 - th3).toFixed(1) +
                      " L" + (tx2 + 5.2).toFixed(1) + " 40 Z", fill: "#ded9c6", opacity: 0.9 }, teethLow);
    }
    teethG._low = teethLow;
  }
  /* gill flares — the toothless close frame's moving part: the gill
     plates bell out as the fish works the lure down its throat */
  var gillFlare = el("g", { opacity: 0 }, head);
  el("path", { d: "M-52 -24 Q-64 4 -56 34", fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-8)}, 0.9), "stroke-width": 3 }, gillFlare);
  el("path", { d: "M52 -24 Q64 4 56 34", fill: "none", stroke: hsl({h:C.back.h, s:C.back.s, l:Math.max(6, C.back.l-8)}, 0.9), "stroke-width": 3 }, gillFlare);
  /* the hooked lure (money shot) — hung in the corner of the mouth,
     hook curve showing against the lip */
  var hookLure = el("g", { opacity: 0, transform: "translate(24 30) rotate(28) scale(0.72)" }, head);
  drawLure(hookLure, CFG.lureKind, 7);
  el("path", { d: "M14 22 Q26 30 24 40", fill: "none", stroke: "#cfd8dc", "stroke-width": 1.6 }, head)
    .setAttribute("opacity", "0");   /* hook glint — lit at the set */
  var hookGlint = head.lastChild;
  return { g: g, head: head, mouthIn: mouthIn, jaw: jaw, eyeL: eyeL, eyeR: eyeR,
           browL: browL, browR: browR, inLure: inLure, hookLure: hookLure, hookGlint: hookGlint,
           throatLure: throatLure, teethG: teethG, gillFlare: gillFlare };
}
function frontPose(scale, x, y, open, wild){
  if(!FRONT) return;
  FRONT.g.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + scale + ")");
  FRONT.mouthIn.setAttribute("ry", (3 + 15 * open).toFixed(1));
  FRONT.jaw.setAttribute("transform", "rotate(" + (open * 13).toFixed(1) + " 0 28)");
  var es = wild ? 1.3 : 1;
  FRONT.eyeL.setAttribute("transform", "translate(-31 -15) scale(" + es + ")");
  FRONT.eyeR.setAttribute("transform", "translate(31 -15) scale(" + es + ")");
  FRONT.browL.setAttribute("opacity", wild ? "0.9" : "0");
  FRONT.browR.setAttribute("opacity", wild ? "0.9" : "0");
  FRONT.hookGlint.setAttribute("opacity", wild ? "0.95" : "0");
}

var wallG = el("g", {}, svg);

/* ---- trophy wall ---- */
(function buildWall(){

var CLASS_DRAIN = { young: 4.2, prime: 5.6, old: 6.6, dinosaur: 7.6 };
function rollPlan(C){
  var r = RNG(C.patSeed + 31);
  var tr = CLASS_T[C.ageClass] || CLASS_T.prime;
  var T = tr[0] + r() * (tr[1] - tr[0]);
  function j(base){ return base * (0.88 + r() * 0.24); }
  return {
    T: T, drainBase: CLASS_DRAIN[C.ageClass] || CLASS_DRAIN.prime,
    dropTarget: 12 + r() * 16,               /* the drop lands 12-28 */
    b: [j(0.12), j(0.35), j(0.50), j(0.68), j(0.78)]
  };
}
function phaseOf(){
  if(!plan) return { name: "grind", drainMul: 1, gainMul: 1 };
  var u = fightMs / plan.T, b = plan.b;
  if(hookState === "loose") return { name: "loose", drainMul: 1.6, gainMul: 0.6 };
  if(u < b[0]) return { name: "run", drainMul: 1.5, gainMul: 0.8 };
  if(u < b[1]) return { name: "grind", drainMul: 1.0, gainMul: 1 };
  if(u < b[2]) return { name: "hang", drainMul: 1.25, gainMul: 1 };
  if(u < b[3]) return { name: "climb", drainMul: 0.4, gainMul: 1 };
  if(u < b[4] || hookState === "slipping") return { name: "drop", drainMul: 5.0, gainMul: 0.12 };
  return { name: "final", drainMul: Math.max(0.45, 1.3 - (u - b[4]) * 2.2), gainMul: 1 };
}
var PHASE_STATUS = {
  run: "IT RUNS — LET IT TAKE LINE", grind: "WORK IT — KEEP PEDALING",
  hang: "IT HANGS — DON'T LET UP", climb: "IT'S COMING — REEL!",
  drop: "THE HOOK SLIPS — ", final: "IT'S TURNING — BRING IT HOME",
  loose: "THE HOOK IS LOOSE — JERK TO RE-SET"
};
/* The fish gives ground BY PHASE: however hard you pedal, a fresh
   fish will not come past the phase's line — it has to tire through
   its phases. The ceilings are what make the 10-60 s window hold
   for a strong player; the drain is what punishes a weak one. */
var PHASE_CEIL = { run: 18, grind: 45, hang: 58, climb: 92, drop: 100, final: 100, loose: 100 };
function startStrike(){
  game = "strike"; strikeT = 0; phaseT = 0;
  strikePhase = "swallow"; setDone = false;
  pedalBank = 0;
  buzz([40, 40, 90]);
  lureG.setAttribute("opacity", "0");      /* the lure is in its mouth now */
  while(leapG.firstChild) leapG.removeChild(leapG.firstChild);
  leapInner = el("g", {}, leapG);
  drawFish(leapInner, pending, 216, {});   /* the set show plays BIG; startFight redraws at fight size */
  leapMouth = el("g", { opacity: 0, transform: "translate(-104 2) rotate(24) scale(0.8)" }, leapInner);
  drawLure(leapMouth, CFG.lureKind, 7);    /* the lure at the lip for the spit-shake */
  leapG.setAttribute("opacity", "0");      /* the leap waits for the set */
  while(frontG.firstChild) frontG.removeChild(frontG.firstChild);
  FRONT = drawFishFront(frontG, pending);
  frontG.setAttribute("opacity", "1");
  bankFG.setAttribute("opacity", "0");         /* the camera pushes in — the bank leaves frame */
  splash(spotX, 118, 16);
  setStatus(""); setHint("");

/* THE SET — one gate, every input class routes here. A catch in the
   window seats the hook and the SET SHOW follows: FISH ON! flashes,
   the beep-beep sounds, the wrist takes a hard burst (setting
   permitting), and the pose set plays — airborne, spit-shake, chomp,
   close frame — with the fish on screen in EVERY frame. The player
   keeps pedaling through the show; the pedals bank into the fight. */
function doSet(){
  if(game !== "strike" || strikePhase !== "setwindow" || setDone) return;
  setDone = true;
  strikePhase = "setshow"; phaseT = 0;
  buzz([120, 60, 200]);                    /* the hard burst — gated by the vibe setting */
  beepBeep();                              /* beep beep */
  fishOnFlash();                           /* FISH ON! */
  setStatus("FISH ON!"); setHint("KEEP PEDALING — IT'S COMING UP");
}
function doSpit(){
  strikePhase = "spit"; phaseT = 0;
  buzz([90, 40, 60]);
  setStatus("NO SET — IT THREW THE " + CFG.lureShort.toUpperCase()); setHint("");
}
/* THE RE-SET — a velocity catch while the hook slips (or hangs loose)
   re-seats it. Pedaling can't; pressure can't; velocity does. */
function doReset(){
  if(game !== "fight") return;
  if(hookState !== "slipping" && hookState !== "loose") return;
  hookState = "seated"; resetDone = true; resetWinT = 0;
  if(plan && phaseName === "drop")            /* a caught slip ends the drop */
    fightMs = Math.max(fightMs, plan.b[4] * plan.T + 1);
  progress = clamp(progress + 6, 0, 100);
  buzz([30, 30, 110]);
  setStatus("HOOK RE-SET — IT CAUGHT!"); setHint("");
  if(progress >= 100) landFish();
}
function startFight(){
  game = "fight";
  /* the pedals the player banked through the set show are LIVE: the
     fight opens with that ground already won and the line already
     loaded — the presentation never paused the player's hands. */
  tension = clamp(46 + pedalBank * 0.5, 46, 60);
  progress = clamp(pedalBank, 0, 14);
  pedalBank = 0;
  fightMs = 0; surgeT = 700; surging = 0; slackMs = 0; tire = 1;
  plan = rollPlan(pending);
  phaseName = "run"; hookState = "seated";
  resetWinT = 0; resetDone = false; finalSlipDone = false; bottomMs = 0; snapMs = 0;
  fishX = 200; fishDir = 1;
  frontG.setAttribute("opacity", "0");
  while(leapG.firstChild) leapG.removeChild(leapG.firstChild);
  leapInner = el("g", {}, leapG);
  drawFish(leapInner, pending, 168, {});   /* fight size */
  leapMouth = null;
  leapG.setAttribute("opacity", "0.94");
  resting = false; restCalled = false; spoolSlack = 0; spoolOn = false;
  meterG.setAttribute("opacity", "1");
  spoolG.setAttribute("opacity", "1");
  bobberG.setAttribute("opacity", "0");
  setStatus(CFG.fish.name.toUpperCase() + " ON — KEEP TENSION IN THE GREEN");
  setHint("PEDAL THE SPOOL · STROKE TO REEL · POWER REEL WHEN IT RESTS");
}
/* THE LANDING (owner fix, Nov 24): progress full is not the end of
   the fight — the fish comes UP. The haul drags it to the surface on
   a line gone straight and tight; then it breaches and FLIES, spray
   and rings running across the whole surface, and only then does
   the wall take it. The payoff moment gets its show. The frame
   branch for game === "landing" plays it; finishLanding() below is
   the old instant landing, now the cinematic's last beat. */
var landT = 0, landFrom = null, landBreachDone = false, ring2Done = false, ring3Done = false;
function landFish(){
  if(game !== "fight") return;
  game = "landing"; landT = 0;
  landBreachDone = false; ring2Done = false; ring3Done = false;
  landFrom = { x: fishX, y: 232 + Math.sin(fightMs / 433) * 26 };
  meterG.setAttribute("opacity", "0");
  spoolG.setAttribute("opacity", "0"); spoolOn = false;
  buzz([50, 40, 90]);
  setStatus("IT'S UP — BRING IT HOME!"); setHint("");
}
function finishLanding(){
  game = "landed"; endT = 0;
  meterG.setAttribute("opacity", "0");
  spoolG.setAttribute("opacity", "0"); spoolOn = false;
  leapG.setAttribute("opacity", "0");
  linePath.setAttribute("d", "");
  buzz([60, 50, 130]);
  mount = pending;
  var d = new Date();
  mountWhen = "LANDED " + ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()] +
              " " + d.getDate() + " · YOUR CATCH";
  try { localStorage.setItem(LSKEY, JSON.stringify({ seed: mount.seed, when: mountWhen })); } catch(e){}
  paintMount(mount, mountWhen);
  /* the catch posts to the house board (shared container storage) */
  try {
    var board = JSON.parse(localStorage.getItem("apex-fishing-board-v1") || "[]");
    board.push({ slug: CFG.slug, fish: CFG.fish.name, len: +mount.lenIn.toFixed(1),
      unit: CFG.fish.unit || "IN", lbs: +mount.lbs.toFixed(1), age: mount.ageClass,
      seed: mount.seed, when: new Date().toISOString() });
    localStorage.setItem("apex-fishing-board-v1", JSON.stringify(board));
  } catch(e){}
  setStatus("LANDED! " + mount.lenIn.toFixed(1) + " " + (CFG.fish.unit || "IN") + " · " + mount.lbs.toFixed(1) + " LB — ON THE WALL");
  setHint("");

/* THE ESCAPE, SEEN (owner fix, Nov 24): a lost fish is not a
   vanished fish. Whatever took it — slack, a worked-loose hook, a
   parted line, a thrown lure — the fish is SEEN leaving: for the
   spit, a hard head-shake with the lure flying out of its mouth;
   then a thrashing run for deep water, the line fallen slack
   behind it. The frame branch for game === "escape" plays it. */
var escT = 0, escKind = "", escFrom = null, escDir = 1, escLure = null, escLureT = -1;
function loseFish(why, kind){
  game = "escape"; escT = 0;
  escKind = kind || "gone";
  escFrom = { x: fishX, y: 232 + Math.sin(fightMs / 433) * 26 };
  escDir = fishX >= 200 ? 1 : -1;          /* away from the middle, for the edge */
  meterG.setAttribute("opacity", "0");
  spoolG.setAttribute("opacity", "0"); spoolOn = false;
  buzz([120, 40, 60]);
  if(escKind === "spit"){
    while(leapG.childNodes.length > 1) leapG.removeChild(leapG.lastChild);
    escLure = el("g", { opacity: 0 }, leapG);
    drawLure(escLure, CFG.lureKind, 7);    /* the lure, ready to be thrown */

}
