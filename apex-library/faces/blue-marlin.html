var splashPool = [];
function splash(x, y, n){
  for(var i = 0; i < n; i++){
    var c = el("circle", { cx: x, cy: y, r: 1.6 + Math.random() * 1.8, fill: "hsla(0,0%,100%,0.85)" }, splashG);
    splashPool.push({ c: c, x: x, y: y, vx: (Math.random() - 0.5) * 130, vy: -60 - Math.random() * 130, life: 0 });
  }
}
/* expanding surface rings — the breach marker: an ellipse that runs
   out across the water and fades, big for a landing, small for a
   ripple. Animated in the same particle pass as the droplets. */
var ringPool = [];
function splashRing(x, y, big){
  var e = el("ellipse", { cx: x, cy: y, rx: 6, ry: 2.2, fill: "none",
    stroke: "hsla(0,0%,100%,0.75)", "stroke-width": big ? 2.2 : 1.4 }, splashG);
  ringPool.push({ e: e, life: 0, dur: big ? 1150 : 800, max: big ? 190 : 90 });
}
/* ================= input: tap metrics + the finger-spool ============ */
/* TAP METRICS (house input doctrine): the fight reads tap VELOCITY and
   IMPACT INTENSITY, not tap count. Pressure comes from the pointer
   where the hardware reports it; tempo stands in where it doesn't. */
var tapLog = [];
function noteTap(ev){
  var now = Date.now();
  tapLog.push({ t: now, p: (ev && ev.pressure) ? ev.pressure : 0.5 });
  while(tapLog.length && now - tapLog[0].t > 900) tapLog.shift();
}
function tapMetrics(){
  var now = Date.now(), n = 0, ps = 0;
  for(var i = 0; i < tapLog.length; i++)
    if(now - tapLog[i].t <= 900){ n++; ps += tapLog[i].p; }
  return { vel: n, int: n ? ps / n : 0.5 };
}
function reelPower(){
  var m = tapMetrics();
  return clamp(0.7 + m.vel * 0.20 + m.int * 0.7, 0.7, 2.3);
}
function doReel(p){
  if(game !== "fight") return;
  var inZone = tension >= 18 && tension <= 86;
  var mult = resting ? 1.5 : 1;               /* the power-reel window */
  var ph = phaseOf();
  /* PEDAL gains against the drain — phase-throttled (a running fish
     gives almost nothing). And for old growth + dinosaurs the law is
     absolute, in any phase: nothing past 92 until a re-set has
     caught this fight. */
  var gain = (inZone ? 1.15 : 0.5) * p * mult * ph.gainMul;
  if((pending.ageClass === "old" || pending.ageClass === "dinosaur") && !resetDone)
    gain = Math.min(gain, Math.max(0, 92 - progress));
  progress += gain;
  var ceil = PHASE_CEIL[ph.name];
  if(ceil != null && progress > ceil) progress = ceil;
  /* v1.1: the fish taxes tension (surges), not the reeling — and
     during the RUN the drag slips: reeling against a running fish
     adds only a drag fraction of its tension, so eagerness in the
     run is futile (gainMul already says so) but not suicidal. */
  tension = clamp(tension + 0.45 * p * (ph.name === "run" ? 0.4 : 1), 0, 104);
  spoolRing.setAttribute("stroke", resting ? "#5ee07d" : "hsla(0,0%,100%,0.5)");
  if(progress >= 100) landFish();
}
/* ============ THE VELOCITY CATCH — set / re-set input ============== */
/* House tap-metrics doctrine: tap metrics denote VELOCITY and IMPACT
   INTENSITY. The hook set and the mid-fight re-set both read a
   velocity catch, per input class:
     - MOTION: a wrist jerk / handset yank — a devicemotion spike
       where the container exposes inertial input;
     - FLICK: a sharp upward flick of the finger (pointer travel
       velocity), the on-glass yank;
     - SNATCH PAIR: two sharp taps in quick succession, the second
       carrying effort (contact diameter — the thumbprint — or
       pressure, where the hardware reports them).
   A held press, however hard, has no velocity and catches NOTHING:
   effort without the spike does not seat a hook. All classes route
   to fireCatch(), which dispatches by game state. */
var lastTapAt = 0, flickTrack = null, lastMotionFire = 0, lastAcc = null;
function catchAttempt(ev){
  var now = Date.now();
  var effort = Math.max((ev && ev.pressure) || 0, ((ev && ev.width) || 0) / 26);
  if(effort >= 0.8){ fireCatch(); lastTapAt = now; return; }   /* one genuinely hard snatch */
  if(now - lastTapAt <= 260 && effort >= 0.55) fireCatch();
  lastTapAt = now;
}
function fireCatch(){
  if(game === "strike") doSet();
  else if(game === "fight") doReset();
}
window.addEventListener("devicemotion", function(ev){
  var a = ev && ev.accelerationIncludingGravity;
  if(!a) return;
  var m = Math.sqrt((a.x || 0) * (a.x || 0) + (a.y || 0) * (a.y || 0) + (a.z || 0) * (a.z || 0));
  if(lastAcc != null && Math.abs(m - lastAcc) >= 13 && Date.now() - lastMotionFire > 500){
    lastMotionFire = Date.now();
    fireCatch();
  }
  lastAcc = m;
});
/* finger-spool state */
var spoolOn = false, spoolSlack = 0, spoolLast = null, spoolAngle = 0;
var svgPt = svg.createSVGPoint();
function toSVG(ev){
  svgPt.x = ev.clientX; svgPt.y = ev.clientY;
  var m = svg.getScreenCTM();
  return m ? svgPt.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}
function spoolDown(ev){
  spoolOn = true; spoolSlack = 0;
  spoolLast = ev ? toSVG(ev) : { x: 342, y: 322 };
  spoolRing.setAttribute("stroke-width", "3.4");
}
function spoolUp(){
  spoolOn = false; spoolLast = null;
  spoolRing.setAttribute("stroke-width", "2");
}
function spoolMove(ev){
  if(!spoolOn) return;
  if(game === "strike" && strikePhase === "setshow"){
    var pb = toSVG(ev); if(!pb || !spoolLast) return;
    var db = Math.sqrt((pb.x - spoolLast.x) * (pb.x - spoolLast.x) + (pb.y - spoolLast.y) * (pb.y - spoolLast.y));
    spoolLast = pb;
    if(db > 0.5) pedalBank = Math.min(16, pedalBank + db * 0.045 * reelPower());
    return;
  }
  if(game !== "fight") return;
  var p = toSVG(ev); if(!p || !spoolLast) return;
  var dx = p.x - spoolLast.x, dy = p.y - spoolLast.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  spoolLast = p;
  if(dist > 0.5){
    spoolAngle = (spoolAngle + dist * 1.4) % 360;
    spoolG.setAttribute("transform", "");      /* ring stays put; knob orbits below */
    doReel(dist * 0.045 * reelPower());
  }
}
function gameTap(ev){
  noteTap(ev);
  if(game === "wall"){ cast(); return; }
  if(game === "aim"){
    /* CHOOSE THE CAST: a tap ON the water is the spot; a tap
       anywhere else takes the arrow where it stands. */
    var ap = (ev && typeof ev.clientX === "number") ? toSVG(ev) : null;
    if(ap && ap.y >= 92 && ap.y <= 215) fireCast(ap.x);
    else fireCast(arrowX);
    return;
  }
  if(game === "wait"){
    var pw = reelPower();
    workGlow = clamp(0.5 + pw * 0.55, 0, 1.7);
    waitMs -= 300 + 260 * pw;                 /* working the lure hurries the strike — less cheaply in v1.1 */
    splash(spotX + (Math.random() - 0.5) * 8, 150, 2);
    if(waitMs <= 0) startStrike();
    return;
  }
  if(game === "strike"){
    catchAttempt(ev);                            /* the snatch-tap class of set */
    /* THE PEDAL NEVER PAUSES (owner, Nov 22): taps through the set
       window and the whole set show BANK as pedal — the fight opens
       with that ground already won. */
    if(game === "strike") pedalBank = Math.min(16, pedalBank + reelPower() * 0.8);
    return;
  }
  if(game === "fight"){ spoolSlack = 0; catchAttempt(ev); doReel(reelPower() * 0.8); }
}
var faceEl = document.getElementById("face");
faceEl.addEventListener("pointerdown", function(ev){
  if(ev.target === dnrChip) return;          /* the license link is a link */
  if(ev.target === vibeChip) return;         /* the vibe switch is a switch */
  if(game === "fight") spoolSlack = 0;       /* a tap is a hand on the rod — only a hand fully off bleeds line */
  if(game === "fight" || (game === "strike" && strikePhase === "setshow")){
    var p = toSVG(ev);
    var dx = p.x - 342, dy = p.y - 322;
    if(Math.sqrt(dx * dx + dy * dy) < 54){ catchAttempt(ev); spoolDown(ev); noteTap(ev); return; }
  }
  if(game === "strike" || game === "fight"){
    var p2 = toSVG(ev);
    flickTrack = { x: p2.x, y: p2.y, t: Date.now() };
  }
  gameTap(ev);
}, true);
faceEl.addEventListener("pointermove", function(ev){
  if(spoolOn) spoolMove(ev);
  if(flickTrack){
    var p = toSVG(ev), now = Date.now(), dtm = now - flickTrack.t;
    var dy = p.y - flickTrack.y;
    if(dy <= -34 && dtm <= 170 && (-dy) / Math.max(1, dtm) >= 0.45){ flickTrack = null; fireCatch(); }
    else if(dtm > 220) flickTrack = null;
  }
}, true);
faceEl.addEventListener("pointerup", function(){ if(spoolOn) spoolUp(); }, true);
faceEl.addEventListener("pointercancel", function(){ if(spoolOn) spoolUp(); }, true);

function gameFrame(dt, t){
  var i, s;
  /* FISH ON! — flashes hard for the first beats, then fades over the
     set show; the fish underneath never leaves the screen. */
  if(fishOnT >= 0){
    fishOnT += dt;
    var fk = fishOnT;
    var fo = fk < 760 ? (Math.sin(fk / 62) > -0.2 ? 1 : 0.25)
                      : Math.max(0, 1 - (fk - 760) / 900);
    fishOnEl.style.opacity = fo.toFixed(2);
    fishOnEl.style.transform = "scale(" + (1 + 0.1 * Math.max(0, 1 - fk / 300)).toFixed(3) + ")";
    if(fk > 1800){ fishOnT = -1; fishOnEl.style.opacity = "0"; }
  }
  if(game === "aim"){
    /* THE AIM: the arrow sweeps the surface BACK AND FORTH, through
       the people's water and the clean water alike — where the cast
       goes is the player's choice and the player's responsibility.
       Single frames, frame-traded: the scene is still; only the
       arrow (a function plate) rides. */
    aimT += dt;
    arrowX = 200 + Math.sin(aimT * (Math.PI * 2 / 2700)) * 168;
    aimG.setAttribute("transform", "translate(" + arrowX.toFixed(1) + " " +
      (Math.sin(aimT / 210) * 2).toFixed(1) + ")");
    rodG.setAttribute("transform", "rotate(" + (Math.sin(aimT / 640) * 2.4).toFixed(2) + " 196 400)");
    linePath.setAttribute("d", "M258 268 Q" + (258 + (arrowX - 258) * 0.4).toFixed(1) + " 210 " +
      arrowX.toFixed(1) + " 112");
  }
  else if(game === "castfly"){
    /* THE FLIGHT, in traded frames: the BACK-CAST frame first — the
       rod swings back over the shoulder and the line trails behind
       (the look-back beat, inside the motion) — then the forward
       frame trades in and the lure flies out and PLUNKS at the
       chosen spot. */
    castT += dt;
    if(castT < 320){                                   /* the back-cast frame */
      var bk = castT / 320;
      rodG.setAttribute("transform", "rotate(" + (-34 * Math.sin(bk * Math.PI)).toFixed(1) + " 196 400)");
      lureG.setAttribute("transform", "translate(" + lerp(258, 96, bk).toFixed(1) + " " +
        lerp(268, 84, bk).toFixed(1) + ") rotate(" + (bk * 120).toFixed(0) + ")");
      linePath.setAttribute("d", "M226 282 Q160 130 " + lerp(258, 96, bk).toFixed(1) + " " + lerp(268, 84, bk).toFixed(1));
    } else {                                           /* the forward flight */
      var fk2 = clamp((castT - 320) / 480, 0, 1);
      rodG.setAttribute("transform", "rotate(" + (6 * Math.sin(fk2 * Math.PI)).toFixed(1) + " 196 400)");
      var fx = lerp(240, spotX, fk2), fy = lerp(250, 118, fk2) - Math.sin(fk2 * Math.PI) * 120;
      lureG.setAttribute("transform", "translate(" + fx.toFixed(1) + " " + fy.toFixed(1) +
        ") rotate(" + (Math.sin(castT / 23) * 14).toFixed(1) + ") scale(" + (1 - fk2 * 0.4).toFixed(2) + ")");
      bobberG.setAttribute("opacity", "1");
      bobberG.setAttribute("transform", "translate(" + fx.toFixed(1) + " " + (fy - 30).toFixed(1) + ")");
      var coil = [];
      for(i = 0; i <= 22; i++){
        var u2 = i / 22, wob = Math.sin(u2 * 13 - castT / 55) * 8 * (1 - u2) * fk2;
        coil.push((i ? "L" : "M") + lerp(258, fx, u2).toFixed(1) + " " + (lerp(268, fy - 14, u2) + wob).toFixed(1));
      }
      linePath.setAttribute("d", coil.join(" "));
      if(castT >= 800) startSettle();
    }
  }
  else if(game === "foul"){
    /* THE FOUL, played straight in the cartoon register: the hook
       takes the hat clean off, the hat sails, the buddy yelps — and
       the cast is gone. The protocol teaches by consequence. */
    foulT += dt;
    var fk3 = clamp(foulT / 700, 0, 1);
    /* hat flight: local +y is DOWN on screen, so the hat sails on a
       negative y arc; local x is steered by the figure's flip */
    if(foulHat) foulHat.setAttribute("transform", "translate(" + (foulSide * foulHat._flip * fk3 * 84).toFixed(1) + " " +
      (-Math.sin(fk3 * Math.PI) * 66 - fk3 * 12).toFixed(1) + ") rotate(" + (foulSide * fk3 * 130).toFixed(0) + ")");
    yelpEl.setAttribute("opacity", foulT > 120 && foulT < 1000 ? "1" : "0");
    lureG.setAttribute("opacity", "1");
    lureG.setAttribute("transform", "translate(" + (spotX + foulSide * fk3 * 46).toFixed(1) + " " +
      (58 - Math.sin(fk3 * Math.PI) * 36).toFixed(1) + ") rotate(" + (fk3 * 200).toFixed(0) + ")");
    linePath.setAttribute("d", "M258 268 Q" + spotX + " 160 " + (spotX + foulSide * fk3 * 46).toFixed(1) + " " +
      (58 - Math.sin(fk3 * Math.PI) * 36).toFixed(1));
    if(foulT >= 1250){
      if(foulHat) foulHat.setAttribute("transform", "");
      yelpEl.setAttribute("opacity", "0");
      lureG.setAttribute("opacity", "0");
      backToWall();
    }
  }
  else if(game === "settle"){
    /* THE SILENCE: rings run out at the CHOSEN spot, the water calms. */
    settleT += dt;
    var sb = 118 + Math.sin(settleT / 300) * 1.1;
    bobberG.setAttribute("transform", "translate(" + spotX + " " + sb.toFixed(1) + ")");
    lureG.setAttribute("transform", "translate(" + spotX + " " + (150 + settleT / 28) + ") rotate(" + (Math.sin(settleT / 90) * 4).toFixed(1) + ")");
    linePath.setAttribute("d", "M" + spotX + " " + sb.toFixed(1) + " L" + spotX + " " + (134 + settleT / 28).toFixed(1));
    for(i = 0; i < ripples.length; i++){
      var rp2 = clamp(settleT / 1150 + ripples[i].ph * 0.3, 0, 1);
      ripples[i].c.setAttribute("r", (6 + rp2 * 30).toFixed(1));
      ripples[i].c.setAttribute("opacity", (0.5 * (1 - rp2)).toFixed(2));
      ripples[i].c.setAttribute("cx", spotX);
      ripples[i].c.setAttribute("cy", 119);
    }
    if(settleT >= 1150) startWait();
  }
  else if(game === "wait"){
    var bobY = 118 + Math.sin(t / 340) * 2.2;
    bobberG.setAttribute("transform", "translate(" + spotX + " " + bobY.toFixed(1) + ")");
    var lureSwing = Math.sin(t / 520) * (6 + workGlow * 16);
    var lureY = 196 + Math.sin(t / 430) * 3;
    lureG.setAttribute("transform", "translate(" + (spotX + lureSwing).toFixed(1) + " " + lureY.toFixed(1) +
      ") rotate(" + (Math.sin(t / 300) * (8 + workGlow * 26)).toFixed(1) + ")");
    linePath.setAttribute("d", "M" + spotX + " " + bobY.toFixed(1) + " L" + (spotX + lureSwing).toFixed(1) + " " + (lureY - 16).toFixed(1));
    for(i = 0; i < ripples.length; i++){
      var rp = (t / 2600 + ripples[i].ph) % 1;
      ripples[i].c.setAttribute("r", (5 + rp * 20).toFixed(1));
      ripples[i].c.setAttribute("opacity", (0.4 * (1 - rp)).toFixed(2));
      ripples[i].c.setAttribute("cx", spotX);
      ripples[i].c.setAttribute("cy", bobY + 1);
    }
    if(!shadowOn && Math.random() < dt / (5200 / (1 + workGlow * 1.3))){ shadowOn = true; shadowDir = Math.random() < 0.5 ? 1 : -1; shadowX = shadowDir > 0 ? -190 : 590; }
    if(shadowOn){
      shadowX += shadowDir * dt * 0.045 * (1 + workGlow);
      shadowG.setAttribute("opacity", "1");
      shadowG.firstChild.setAttribute("transform",
        "translate(" + shadowX.toFixed(1) + " " + (262 + Math.sin(t / 700) * 7).toFixed(1) + ") scale(" + shadowDir + " 1)");
      if(shadowX < -240 || shadowX > 640) shadowOn = false;
    } else shadowG.setAttribute("opacity", "0");
    workGlow = Math.max(0, workGlow - dt / 620);
    waitMs -= dt * (1 + workGlow * 0.5);
    if(waitMs <= 0) startStrike();
  }
  else if(game === "strike"){
    /* THE POSE SEQUENCE (v1.1): SWALLOW (front-facing, bait going
       in, camera scoping back out) -> SET WINDOW (the money shot:
       mouth open, eyes wild, lure hooked at the lip — the player
       sets the hook or loses the moment) -> ERUPTION + DIVE (side
       poses) -> the fight. No set: the fish THROWS the lure. */
    strikeT += dt; phaseT += dt;
    var zoomK = clamp(strikeT / 1500, 0, 1);
    stageZoom((1 - 0.12 * zoomK).toFixed(3));      /* the pullback */
    if(strikePhase === "swallow"){
      var sk = clamp(phaseT / 600, 0, 1);
      var open = phaseT < 130 ? phaseT / 130 * 0.4 :
                 phaseT < 380 ? 0.4 + (phaseT - 130) / 250 * 0.6 :
                 1 - (phaseT - 380) / 220 * 0.7;
      frontPose(0.55 + sk * 0.51, spotX, 158, clamp(open, 0, 1), false);
      var lk = clamp((phaseT - 140) / 340, 0, 1);
      FRONT.inLure.setAttribute("opacity", lk > 0 && lk < 1 ? "1" : "0");
      FRONT.inLure.setAttribute("transform", "translate(0 " + lerp(-128, 14, lk).toFixed(1) + ") rotate(" + (Math.sin(phaseT / 30) * 10).toFixed(1) + ")");
      bobberG.setAttribute("transform", "translate(" + spotX + " " + (118 + sk * 26) + ")");
      linePath.setAttribute("d", "M" + spotX + " " + (118 + sk * 26) + " L" + spotX + " 128");
      if(phaseT >= 600){
        strikePhase = "setwindow"; phaseT = 0;
        FRONT.inLure.setAttribute("opacity", "0");
        FRONT.hookLure.setAttribute("opacity", "1");
        setStatus("SET THE HOOK!"); setHint("JERK — WRIST FLIP · YANK · SNATCH IT");
      }
    }
    else if(strikePhase === "setwindow"){
      frontPose(1.06, spotX, 158, 0.55, true);
      FRONT.head.setAttribute("transform", "rotate(" + (Math.sin(phaseT / 46) * 2.6).toFixed(2) + ")");
      if(phaseT >= 850 && !setDone) doSpit();
    }
    else if(strikePhase === "setshow"){
      /* THE SET SHOW (owner playtest fix, Nov 22): the set gets its
         own pose set, and the fish NEVER blanks — every beat opens
         with its fish already on screen, fades overlap, nothing
         fades to empty water. A: AIRBORNE (the leap, big). B: THE
         SPIT SHAKE (side pose at the surface, head shaking, the
         lure at its lip). C: THE CHOMP (face on, mouth snapping,
         the lure in its mouth). D: THE CLOSE FRAME (teeth gnashing
         for the toothed class; the lure deep in the throat with the
         gills flaring for the toothless; pinned at the bill for the
         marlin). Then the fight takes the same fish. */
      var cf = CFG.fish.closeFrame || "throat";
      if(phaseT < 500){                                   /* A — AIRBORNE */
        var ka = clamp(phaseT / 500, 0, 1);
        frontG.setAttribute("opacity", (1 - clamp(phaseT / 160, 0, 1)).toFixed(2));
        leapG.setAttribute("opacity", "1");
        var ax = 200 + (ka - 0.5) * 92, ay = 158 - Math.sin(ka * Math.PI) * 106;
        leapInner.setAttribute("transform", "translate(" + ax.toFixed(1) + " " + ay.toFixed(1) +
          ") rotate(" + (-42 + ka * 84).toFixed(1) + ")");
        linePath.setAttribute("d", "M388 28 L" + (ax - 96).toFixed(1) + " " + ay.toFixed(1));
        if(phaseT - dt < 40 && phaseT >= 40) splash(196, 118, 16);
        if(phaseT - dt < 452 && phaseT >= 452) splash(ax, 120, 13);
      }
      else if(phaseT < 950){                              /* B — SPIT SHAKE */
        var kb = (phaseT - 500) / 450;
        leapG.setAttribute("opacity", "1");
        var bx = 246 - kb * 22, by = 130 + Math.sin(phaseT / 90) * 3;
        leapInner.setAttribute("transform", "translate(" + bx.toFixed(1) + " " + by.toFixed(1) +
          ") rotate(" + (Math.sin(phaseT / 33) * 13).toFixed(1) + ")");
        if(leapMouth) leapMouth.setAttribute("opacity", "1");
        linePath.setAttribute("d", "M388 28 L" + (bx - 100).toFixed(1) + " " + (by - 4).toFixed(1));
        if(phaseT - dt < 540 && phaseT >= 540) splash(bx - 60, 120, 8);
        if(phaseT - dt < 760 && phaseT >= 760) splash(bx - 30, 120, 7);
      }
      else if(phaseT < 1400){                             /* C — THE CHOMP */
        var kc = (phaseT - 950) / 450;
        leapG.setAttribute("opacity", Math.max(0, 1 - clamp((phaseT - 950) / 110, 0, 1)).toFixed(2));
        frontG.setAttribute("opacity", clamp((phaseT - 950) / 90, 0, 1).toFixed(2));
        var chomp = 0.3 + 0.65 * Math.abs(Math.sin(kc * Math.PI * 2));
        frontPose(1.16, 200, 160, chomp, true);
        FRONT.head.setAttribute("transform", "rotate(" + (Math.sin(phaseT / 52) * 2.2).toFixed(2) + ")");
        FRONT.hookLure.setAttribute("opacity", "0");      /* the lure is IN the mouth now */
        FRONT.throatLure.setAttribute("opacity", "1");
        linePath.setAttribute("d", "M200 0 L200 108");
      }
      else {                                              /* D — THE CLOSE FRAME */
        var kd = clamp((phaseT - 1400) / 550, 0, 1);
        frontG.setAttribute("opacity", "1");
        leapG.setAttribute("opacity", "0");
        var gnash = 0.74 + Math.sin(phaseT / 36) * 0.09;
        frontPose(1.44, 200, 184, gnash, true);
        FRONT.head.setAttribute("transform", "rotate(" + (Math.sin(phaseT / 31) * 1.3).toFixed(2) + ")");
        FRONT.throatLure.setAttribute("opacity", "1");
        if(cf === "teeth" && FRONT.teethG){
          FRONT.teethG.setAttribute("opacity", Math.min(1, kd * 2).toFixed(2));
          if(FRONT.teethG._low) FRONT.teethG._low.setAttribute("transform", "translate(0 " + (gnash * 5).toFixed(1) + ")");
          FRONT.throatLure.setAttribute("transform", "translate(0 34) scale(0.85)");
        } else if(cf === "bill"){
          FRONT.throatLure.setAttribute("transform", "translate(0 20) scale(0.66)");  /* pinned at the bill's base */
        } else {
          FRONT.gillFlare.setAttribute("opacity", (0.45 + 0.5 * Math.sin(phaseT / 95)).toFixed(2));
          FRONT.throatLure.setAttribute("transform", "translate(0 38) scale(0.85)");  /* deep in the throat */
        }
        linePath.setAttribute("d", "M200 0 L200 122");
      }
      if(phaseT >= 1950) startFight();
    }
    else if(strikePhase === "spit"){
      var pk = clamp(phaseT / 1050, 0, 1);
      frontPose(1.02 - pk * 0.14, 200, 158 + pk * 44, 1, false);
      frontG.setAttribute("opacity", (1 - clamp((phaseT - 500) / 450, 0, 1)).toFixed(2));
      FRONT.hookLure.setAttribute("opacity", "0");
      FRONT.inLure.setAttribute("opacity", "1");
      FRONT.inLure.setAttribute("transform", "translate(" + (pk * 120).toFixed(1) + " " +
        (14 - Math.sin(pk * Math.PI) * 120 - pk * 30).toFixed(1) + ") rotate(" + (pk * 260).toFixed(1) + ")");
      if(phaseT > 140 && phaseT - dt <= 140) splash(212, 120, 12);
      if(phaseT >= 1050) backToWall();
    }
  }
  else if(game === "fight"){
    fightMs += dt;
    var ph = phaseOf();
    /* ---- phase transitions + the slip events ---- */
    if(ph.name !== phaseName){
      phaseName = ph.name;
      if(ph.name === "drop" && hookState === "seated"){
        hookState = "slipping";
        slipTarget = Math.max(4, Math.min(plan.dropTarget, progress - 6));
        resetWinT = 2600;
        buzz(70);
        setStatus("THE HOOK SLIPS —"); setHint("JERK TO RE-SET — WRIST · YANK · FLICK");
      } else if(hookState === "seated"){
        setStatus(PHASE_STATUS[ph.name] || "");
      }
    }
    /* old growth and dinosaurs demand a re-set before they come in:
       entering the final without one triggers a last slip */
    if(ph.name === "final" && !finalSlipDone && !resetDone &&
       (pending.ageClass === "old" || pending.ageClass === "dinosaur")){
      finalSlipDone = true; hookState = "slipping";
      slipTarget = Math.max(10, Math.min(55 + Math.random() * 10, progress - 8));
      resetWinT = 2600;
      buzz(70);
      setStatus("ONE MORE SLIP —"); setHint("JERK TO RE-SET — WRIST · YANK · FLICK");
    }
    /* ---- the meter: pedal gains live in doReel; here it drains ---- */
    var fatigue = Math.max(0.30, 1 - 0.65 * (fightMs / plan.T));
    if(hookState === "slipping"){
      resetWinT -= dt;
      progress = Math.max(slipTarget, progress - 30 * dt / 1000);   /* the slip runs fast */
      tension = clamp(tension + dt * 0.012, 0, 104);
      if(resetWinT <= 0){ hookState = "loose"; phaseName = "loose"; setStatus(PHASE_STATUS.loose); setHint("JERK TO RE-SET — WRIST · YANK · FLICK"); }
    } else {
      progress -= plan.drainBase * ph.drainMul * fatigue * dt / 1000;
    }
    progress = clamp(progress, 0, 100);
    /* a fully bottomed meter, hook slipping or loose, is the hook pulled */
    if(progress <= 0 && hookState !== "seated"){
      bottomMs += dt;
      if(bottomMs > 900){ loseFish("THE HOOK PULLED — IT WORKED IT LOOSE", "loose"); return; }
    } else bottomMs = 0;
    /* ---- tension: surges, decay, slack (v1.0 grammar, retimed) ---- */
    surgeT -= dt;
    if(surgeT <= 0){ surging = 380 + Math.random() * 320; surgeT = 1150 + Math.random() * 1350; buzz(55);
      /* THE HUMBUG (owner, Nov 24): sometimes it just throws the
         lure — a head-shake on the surge, no fault of the angler's.
         ~1.2% a surge once the fight is real (roughly one fight in
         six or seven): rare enough to curse, common enough to see.
         Distinct from every earned loss. */
      if(hookState === "seated" && fightMs > 4000 && Math.random() < 0.012){
        loseFish("IT SPIT THE " + CFG.lureShort.toUpperCase() + "! — THREW IT ON THE SHAKE", "spit");
        return;
      }
    }
    if(surging > 0){ tension += dt * 0.044 * tire; surging -= dt;
      if(surging <= 0) tension -= 6; }   /* the run spends itself — the sawtooth must not ratchet */
    tension -= dt * 0.010;
    if(spoolOn){ spoolSlack = 0; }
    else {
      spoolSlack += dt;
      if(spoolSlack > 900) tension -= dt * 0.020;
    }
    resting = surging <= 0 && surgeT < 620 && hookState === "seated";
    if(resting && !restCalled){ restCalled = true; setHint("IT RESTS — POWER REEL, NOW"); }
    if(!resting) restCalled = false;
    tire = clamp(1 - 0.55 * fightMs / plan.T, 0.4, 1);
    tension = clamp(tension, 0, 104);
    /* THE SNAP IS SUSTAINED OVERLOAD, not a one-frame spike: a surge
       peak you release survives; holding the red for ~350 ms parts
       the line. (Calibration, Nov 22: spike-snaps were killing
       honest fights on the surge sawtooth.) */
    if(tension >= 100){ snapMs += dt; if(snapMs > 350) loseFish("SNAP! — THE LINE PARTED", "snap"); }
    else snapMs = Math.max(0, snapMs - dt * 2);
    if(tension <= 3){ slackMs += dt; if(slackMs > 2200 && fightMs > 3500) loseFish(spoolSlack > 900 ? "FINGER OFF THE SPOOL — IT RAN THE SLACK OUT" : "SLACK LINE — IT SHOOK FREE", "slack"); }
    else slackMs = Math.max(0, slackMs - dt * 2);
    if(game !== "fight") return;               /* snapped / shook free above */
    buzzT -= dt;
    if(tension > 84 && buzzT <= 0){ buzz(28); buzzT = 600; }   /* wiggle through the spool */
    /* ---- the fish, SEEN working: runs with the drain, thrashes ---- */
    var drainNow = hookState === "slipping" ? 16 : plan.drainBase * ph.drainMul * fatigue;
    var speed = 30 + drainNow * 6.5;
    fishX += fishDir * speed * dt / 1000;
    if(fishX > 306){ fishX = 306; fishDir = -1; }
    if(fishX < 94){ fishX = 94; fishDir = 1; }
    var fy = 232 + Math.sin(fightMs / 433) * 26;
    var thrashMs = Math.max(34, 74 - drainNow * 2.4);
    leapInner.setAttribute("transform", "translate(" + fishX.toFixed(1) + " " + fy.toFixed(1) +
      ") rotate(" + (Math.sin(fightMs / thrashMs) * (5 + drainNow * 0.55)).toFixed(1) +
      ") scale(" + (fishDir < 0 ? 0.88 : -0.88) + " 0.88)");
    leapG.setAttribute("opacity", "0.94");
    linePath.setAttribute("d", "M388 30 Q" + ((388 + fishX) / 2) + " " + (60 + tension * 0.4) + " " + fishX.toFixed(1) + " " + (fy - 8).toFixed(1));
    var mh = clamp(tension, 0, 100) / 100 * 158;
    meterFill.setAttribute("y", (308 - mh).toFixed(1));
    meterFill.setAttribute("height", mh.toFixed(1));
    meterFill.setAttribute("fill", tension > 82 ? "#ff5347" : (tension < 22 ? "#57b6e6" : "#ffc44d"));
    progFill.setAttribute("width", (progress / 100 * 300).toFixed(1));
    progFill.setAttribute("fill", hookState !== "seated" ? "#ff5347" : (progress <= 30 ? "#ffc44d" : "#5ee07d"));
    spoolRing.setAttribute("transform", "rotate(" + spoolAngle.toFixed(1) + " 342 322)");
    if(speed > 95 && Math.random() < dt / 260) splash(fishX, 122, 2);
  }
  else if(game === "landing"){
    /* THE LANDING, PLAYED: HAUL (the fish dragged up, the bow
       leaving the line until it hums straight) -> BREACH (it flies
       out of the water on that tight line, the full-page splash,
       rings running out) -> the wall takes it. */
    landT += dt;
    var surfX = 292, surfY = 130;
    if(landT < 520){                                    /* THE HAUL */
      var hk = clamp(landT / 520, 0, 1), he = hk * hk * (3 - 2 * hk);
      var hx = lerp(landFrom.x, surfX, he), hy = lerp(landFrom.y, surfY, he);
      leapInner.setAttribute("transform", "translate(" + hx.toFixed(1) + " " + hy.toFixed(1) +
        ") rotate(" + (Math.sin(landT / 40) * 7).toFixed(1) + ") scale(-0.88 0.88)");
      leapG.setAttribute("opacity", "0.97");
      var sag = lerp(46, 2, he);                        /* the bow leaves the line */
      linePath.setAttribute("d", "M388 30 Q" + ((388 + hx) / 2).toFixed(1) + " " + ((30 + hy) / 2 + sag).toFixed(1) +
        " " + hx.toFixed(1) + " " + (hy - 10).toFixed(1));
      if(Math.random() < dt / 90) splash(hx + (Math.random() - 0.5) * 30, 121, 2);
    } else if(landT < 1420){                            /* THE BREACH — it FLIES */
      var bk = clamp((landT - 520) / 900, 0, 1);
      if(!landBreachDone){
        landBreachDone = true;
        splash(surfX, 118, 64);                         /* the full-page fish splash */
        splashRing(surfX, 119, true);
        buzz([40, 30, 140]);
        setStatus("OUT OF THE WATER!"); setHint("");
      }
      if(landT > 700 && !ring2Done){ ring2Done = true; splashRing(surfX - 26, 119, false); splash(surfX - 20, 118, 18); }
      if(landT > 900 && !ring3Done){ ring3Done = true; splashRing(surfX + 30, 119, false); splash(surfX + 24, 118, 14); }
      var bx = surfX + bk * 38, by = surfY - Math.sin(bk * Math.PI) * 96 + bk * 26;
      leapInner.setAttribute("transform", "translate(" + bx.toFixed(1) + " " + by.toFixed(1) +
        ") rotate(" + (-58 + bk * 168).toFixed(1) + ") scale(-0.92 0.92)");
      /* the line stays TIGHT: rod tip to mouth, straight */
      linePath.setAttribute("d", "M388 30 L" + (bx - 74).toFixed(1) + " " + (by - 6).toFixed(1));
      if(Math.random() < dt / 60) splash(bx - 40, by + 26, 1);   /* water off the fish */
    } else {                                            /* the wall takes it */
      leapG.setAttribute("opacity", clamp(1 - (landT - 1420) / 260, 0, 1).toFixed(2));
      linePath.setAttribute("d", "");
      if(landT >= 1700) finishLanding();
    }
  }
  else if(game === "escape"){
    /* THE ESCAPE, PLAYED: for the spit, THE SHAKE first — the head
       thrashes and the lure is seen flying out of the mouth — then
       THE RUN: a thrashing dive for deep water, gone off the edge,
       the line fallen slack and sinking behind it. */
    escT += dt;
    var ex = escFrom.x, ey = escFrom.y;
    if(escKind === "spit" && escT < 480){               /* THE SHAKE */
      var shk = Math.sin(escT / 26) * 13 * (1 - escT / 480);
      leapInner.setAttribute("transform", "translate(" + ex.toFixed(1) + " " + ey.toFixed(1) +
        ") rotate(" + shk.toFixed(1) + ") scale(" + (escDir > 0 ? -0.88 : 0.88) + " 0.88)");
      leapG.setAttribute("opacity", "0.94");
      linePath.setAttribute("d", "M388 30 Q" + ((388 + ex) / 2).toFixed(1) + " 96 " + ex.toFixed(1) + " " + (ey - 8).toFixed(1));
      if(escLure && escT > 190){
        if(escLureT < 0) escLureT = 0; else escLureT += dt;
        var lk = clamp(escLureT / 620, 0, 1);
        var lx = ex - escDir * 60 - lk * escDir * 120;
        var ly = ey - 14 - Math.sin(lk * Math.PI) * 66 + lk * lk * 120;
        escLure.setAttribute("opacity", "1");
        escLure.setAttribute("transform", "translate(" + lx.toFixed(1) + " " + ly.toFixed(1) + ") rotate(" + (lk * 300 * escDir).toFixed(1) + ")");
        if(lk >= 1){ splash(clamp(lx, 8, 392), 120, 6); escLure.setAttribute("opacity", "0"); escLure = null; }
      }
    } else {                                            /* THE RUN FOR DEEP WATER */
      var rk = clamp((escT - (escKind === "spit" ? 480 : 0)) / 1500, 0, 1);
      var re = rk * rk * (3 - 2 * rk);
      ex = escFrom.x + escDir * re * 300;
      ey = escFrom.y + re * 96 + Math.sin(escT / 90) * (4 + (1 - rk) * 5);
      leapInner.setAttribute("transform", "translate(" + ex.toFixed(1) + " " + ey.toFixed(1) +
        ") rotate(" + (Math.sin(escT / 34) * 8).toFixed(1) + ") scale(" + (escDir > 0 ? -0.88 : 0.88) + " 0.88)");
      leapG.setAttribute("opacity", (0.94 * (1 - rk * 0.55)).toFixed(2));
      /* the line falls slack and sinks behind it */
      linePath.setAttribute("d", "M388 30 Q" + ((388 + escFrom.x) / 2).toFixed(1) + " " + (150 + rk * 90).toFixed(1) +
        " " + escFrom.x.toFixed(1) + " " + (escFrom.y + rk * 60).toFixed(1));
      if(rk < 0.4 && Math.random() < dt / 120) splash(clamp(ex - escDir * 60, 8, 392), 122, 2);
    }
    if(escT >= 2300){ game = "lost"; endT = 1100; leapG.setAttribute("opacity", "0"); linePath.setAttribute("d", ""); }
  }
  else if(game === "landed" || game === "lost"){
    endT += dt;
    if(endT > 2500) backToWall();
  }
  /* splash particles, any state */
  for(i = splashPool.length - 1; i >= 0; i--){
    s = splashPool[i]; s.life += dt;
    s.x += s.vx * dt / 1000; s.y += s.vy * dt / 1000; s.vy += 340 * dt / 1000;
    s.c.setAttribute("cx", s.x.toFixed(1)); s.c.setAttribute("cy", s.y.toFixed(1));
    s.c.setAttribute("opacity", clamp(1 - s.life / 620, 0, 1).toFixed(2));
    if(s.life > 620){ splashG.removeChild(s.c); splashPool.splice(i, 1); }
  }
  /* splash rings, any state */
  for(i = ringPool.length - 1; i >= 0; i--){
    var rg = ringPool[i]; rg.life += dt;
    var rk2 = clamp(rg.life / rg.dur, 0, 1);
    rg.e.setAttribute("rx", (6 + rk2 * rg.max).toFixed(1));
    rg.e.setAttribute("ry", (2.2 + rk2 * rg.max * 0.30).toFixed(1));
    rg.e.setAttribute("opacity", (0.8 * (1 - rk2)).toFixed(2));
    if(rk2 >= 1){ splashG.removeChild(rg.e); ringPool.splice(i, 1); }
  }
}

/* ================= clock ============================================ */
var clockEl = document.getElementById("clock"), dateEl = document.getElementById("dateLine");
var lampEl = document.getElementById("stateLamp");
var DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
var MONS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var lastMinute = -1;
function paintTime(now){
  var m = now.getMinutes();
  lastMinute = m;
  var hh = now.getHours(), h12 = hh % 12; if(h12 === 0) h12 = 12;
  clockEl.textContent = (h12 < 10 ? "0" : "") + h12 + ":" + (m < 10 ? "0" : "") + m;
  dateEl.textContent = DAYS[now.getDay()] + " · " + MONS[now.getMonth()] + " " + now.getDate() +
    " · " + (hh < 12 ? "AM" : "PM");
}

/* ================= Battery V2 state machine ========================= */
var REST = "rest", OBSERVED = "observed";
var state = REST, raf = 0, exitTimer = 0, lastFrameT = 0;
var gov = { state: "rest", enters: 0, rests: 0, lastSignal: "boot" };
window.__governor = gov;
window.__faceRest = true;
function stillPass(){ paintTime(new Date()); }
function obsFrame(){
  if(state !== OBSERVED) return;
  var now = Date.now();
  var dt = lastFrameT ? Math.min(64, now - lastFrameT) : 16;
  lastFrameT = now;
  gameFrame(dt, now);
  raf = requestAnimationFrame(obsFrame);
}
function setLamp(){ lampEl.textContent = (state === OBSERVED) ? "OBSERVED" : "REST"; }
function observe(sig){
  if(state !== OBSERVED){
    state = OBSERVED; lastFrameT = 0;
    gov.state = "observed"; gov.enters++; window.__faceRest = false;
    document.body.classList.add("observed"); setLamp();
    armTrades();                                   /* plates trade only while watched */
    raf = requestAnimationFrame(obsFrame);
  }
  gov.lastSignal = sig || "signal";
  if(exitTimer) clearTimeout(exitTimer);
  exitTimer = setTimeout(function(){ rest(); }, 12000);   /* 12 s auto-exit */
}
function rest(sig){
  if(state === REST){ gov.lastSignal = sig || gov.lastSignal; stillPass(); return; }
  state = REST;
  gov.state = "rest"; gov.rests++; gov.lastSignal = sig || "signal";
  window.__faceRest = true;
  clearTrades();                                   /* the stack freezes at REST */
  if(raf) cancelAnimationFrame(raf); raf = 0;
  if(exitTimer){ clearTimeout(exitTimer); exitTimer = 0; }
  document.body.classList.remove("observed"); setLamp();
  stillPass();
}
function toggle(){ (state === OBSERVED) ? rest("toggle") : observe("toggle"); }
window.ApexFace = {
  observe: function(){ observe("container-observe"); },
  rest:    function(){ rest("container-rest"); },
  toggle:  toggle,
  state:   function(){ return state; },
  game:    function(){ return game; }        /* bench surface */
};
window.__fishBench = {                        /* bench surface, governor class */
  game: function(){ return game; },
  cast: cast, tap: gameTap,
  reel: doReel,
  spoolDown: function(){ spoolDown(null); },
  spoolUp: spoolUp,
  spoolStroke: function(d){ if(spoolOn) doReel(d * 0.045 * 1.2); },
  resting: function(){ return resting; },
  spoolSlack: function(){ return spoolSlack; },
  board: function(){ try { return JSON.parse(localStorage.getItem("apex-fishing-board-v1") || "[]"); } catch(e){ return null; } },
  setWait: function(ms){ waitMs = ms; },
  /* v1.1 bench surface: the set gate, the re-set, the fight plan */
  setHook: function(){ doSet(); },
  jerk: function(){ fireCatch(); },
  strikePhase: function(){ return strikePhase; },
  hookState: function(){ return hookState; },
  phase: function(){ return phaseName; },
  plan: function(){ return plan; },
  resetDone: function(){ return resetDone; },
  /* v1.1 cast + set-show bench surface */
  fireCast: function(x){ fireCast(x); },
  arrowX: function(){ return arrowX; },
  spotX: function(){ return spotX; },
  pedalBank: function(){ return pedalBank; },
  fishOn: function(){ return fishOnT >= 0; },
  vibe: function(){ return vibeOn; },
  setVibe: function(on){ vibeOn = !!on; paintVibe(); },
  frontRefs: function(){ return FRONT ? { teeth: !!FRONT.teethG, close: CFG.fish.closeFrame || "throat" } : null; },
  forceAge: function(cls){
    for(var s = 1; s < 20000; s++){
      var c = rollCatch(s);
      if(c.ageClass === cls){
        pending = c;
        showScene(true);
        startStrike();
        return s;
      }
    }
    return -1;
  },
  tension: function(){ return tension; },
  setTension: function(v){ tension = v; },
  progress: function(){ return progress; },
  setProgress: function(v){ progress = v; },
  /* v1.2 bench surface: the landing + escape cinematics */
  forceSpit: function(){ if(game === "fight") loseFish("IT SPIT THE " + CFG.lureShort.toUpperCase() + "! — THREW IT ON THE SHAKE", "spit"); },
  forceLose: function(kind){ if(game === "fight") loseFish("BENCH LOSS", kind || "slack"); },
  escKind: function(){ return escKind; },
  landT: function(){ return landT; },
  fishPos: function(){ var t = leapInner ? leapInner.getAttribute("transform") : ""; return t || ""; },
  callouts: function(){
    var p = plateEl.getBoundingClientRect(), s = statusEl.getBoundingClientRect(), h = hintEl.getBoundingClientRect();
    return { plate: { x: p.x, y: p.y, w: p.width, h: p.height, display: plateEl.style.display },
             status: { y: s.y, h: s.height, sw: statusEl.scrollWidth, cw: statusEl.clientWidth, fs: statusEl.style.fontSize || "" },
             hint: { y: h.y, h: h.height, sw: hintEl.scrollWidth, cw: hintEl.clientWidth, fs: hintEl.style.fontSize || "" } };
  },
  mount: function(){ return mount; }
};
window.addEventListener("apex-face-observe", function(){ observe("event-observe"); });
window.addEventListener("apex-face-rest", function(){ rest("event-rest"); });
window.addEventListener("focus", function(){ if(!document.hidden) observe("focus"); });
window.addEventListener("blur", function(){ rest("blur"); });
window.addEventListener("pointerdown", function(){ observe("pointer"); }, true);
window.addEventListener("touchstart", function(){ observe("touch"); }, true);
window.addEventListener("keydown", function(){ observe("key"); }, true);
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ rest("hidden"); }
  else if(document.hasFocus && document.hasFocus()){ observe("visible"); }
  else { paintTime(new Date()); }
});

/* ================= boot ============================================= */
paintTime(new Date());
setLamp();
if(/[?&]face=observed/.test(location.search)) observe();
if(/[?&]autocast=1/.test(location.search)) cast();   /* bench hook */
setInterval(function(){
  var now = new Date();
  if(now.getMinutes() !== lastMinute){ paintTime(now); }
}, 1000);
</script>
</body>
</html>
